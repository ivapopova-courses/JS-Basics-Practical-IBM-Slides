<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="10" y="10" width="400" height="300" rx="18" fill="#1e2433"/>
  <circle cx="38" cy="36" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="36" r="6" fill="#febc2e"/>
  <circle cx="78" cy="36" r="6" fill="#28c840"/>
  <text x="32" y="80" font-size="15" fill="#c792ea">function <tspan fill="#82aaff">rule</tspan><tspan fill="#e6e6e6">(doc) {</tspan></text>
  <text x="52" y="110" font-size="15" fill="#c792ea">const <tspan fill="#e6e6e6">model = doc.</tspan><tspan fill="#ffcb6b">overview</tspan><tspan fill="#e6e6e6">.model;</tspan></text>
  <text x="52" y="140" font-size="15" fill="#c792ea">const <tspan fill="#e6e6e6">version = doc.</tspan><tspan fill="#ffcb6b">overview</tspan><tspan fill="#e6e6e6">.version;</tspan></text>
  <text x="52" y="180" font-size="15" fill="#c792ea">if <tspan fill="#e6e6e6">(model === </tspan><tspan fill="#c3e88d">"XR-220"</tspan><tspan fill="#e6e6e6">) {</tspan></text>
  <text x="72" y="210" font-size="15" fill="#82aaff">emit<tspan fill="#e6e6e6">(</tspan><tspan fill="#c3e88d">"CHK-0211"</tspan><tspan fill="#e6e6e6">);</tspan></text>
  <text x="52" y="240" font-size="15" fill="#e6e6e6">}</text>
  <text x="32" y="270" font-size="15" fill="#e6e6e6">}</text>
  <rect x="300" y="250" width="86" height="34" rx="8" fill="#2f5bd3"/>
  <text x="343" y="272" font-size="14" font-family="system-ui, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">Run</text>
</svg>
