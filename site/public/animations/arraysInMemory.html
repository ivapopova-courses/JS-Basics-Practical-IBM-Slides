<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrays in memory</title>
<!--
    Step-by-step animation: how JavaScript arrays live in memory
    (stack variable -> reference -> array object in the heap).
    Sibling of pages/themes/JS_BasicSyntax/animations/variablesInMemory.html.
    Self-contained (no external files), so it works offline and inside an iframe.
    Deep links: arraysInMemory.html#3 (scenario 3), #3.5 (scenario 3, step 5),
    ?theme=dark forces the dark theme, #selftest walks every step and reports.
-->
<style>
:root {
    --paper: #f3eee3;
    --panel: #fffcf5;
    --ink: #26221c;
    --muted: #786f61;
    --line: #ddd3c1;
    --inline-code: #ece5d6;

    --code-bg: #22252f;
    --code-ink: #e9e6dd;
    --code-num: #6c7285;
    --code-active: #363d52;
    --code-marker: #ffd166;

    --var-bg: #c4e3b8;
    --var-border: #4f8a45;
    --var-ink: #18330f;
    --foreign-bg: #efb1ac;
    --foreign-bg2: #f6c9c5;
    --foreign-border: #b55b55;
    --foreign-ink: #6e2420;
    --free-bg: #efe9dc;
    --free-border: #cfc4af;

    --read: #2563c9;
    --read-bg: #dbe7fb;
    --write: #d66d08;
    --write-bg: #fde5c8;
    --err: #c4302b;
    --err-bg: #f9d9d6;
    --ref: #7b48c4;
    --heap-bg: #fff3cf;
    --heap-border: #c99a2e;
    --chip-ink: #ffffff;

    --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace;
    --sans: "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
    --row-h: 2.75rem;
    --cols: 4.6rem 6.4rem 9rem;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --paper: #17181d; --panel: #202229; --ink: #ecebe6; --muted: #9a988f; --line: #363945; --inline-code: #2d3039;
        --code-bg: #111318; --code-active: #2c3345;
        --var-bg: #2c4a2a; --var-border: #71b066; --var-ink: #d8f3cf;
        --foreign-bg: #5a2b2a; --foreign-bg2: #4a2423; --foreign-border: #c46e67; --foreign-ink: #f3c2be;
        --free-bg: #262830; --free-border: #3d404c;
        --read: #6ea2ff; --read-bg: #1f3354; --write: #ffa24d; --write-bg: #4a2e12;
        --err: #ff6b63; --err-bg: #4a1c1a; --ref: #b38cff; --heap-bg: #3a3220; --heap-border: #c9a24a;
        --chip-ink: #111111;
    }
}
:root[data-theme="dark"] {
    --paper: #17181d; --panel: #202229; --ink: #ecebe6; --muted: #9a988f; --line: #363945; --inline-code: #2d3039;
    --code-bg: #111318; --code-active: #2c3345;
    --var-bg: #2c4a2a; --var-border: #71b066; --var-ink: #d8f3cf;
    --foreign-bg: #5a2b2a; --foreign-bg2: #4a2423; --foreign-border: #c46e67; --foreign-ink: #f3c2be;
    --free-bg: #262830; --free-border: #3d404c;
    --read: #6ea2ff; --read-bg: #1f3354; --write: #ffa24d; --write-bg: #4a2e12;
    --err: #ff6b63; --err-bg: #4a1c1a; --ref: #b38cff; --heap-bg: #3a3220; --heap-border: #c9a24a;
    --chip-ink: #111111;
}

* { box-sizing: border-box; }
html { font-size: clamp(11px, min(1.15vw, 2.05vh), 22px); }
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
}
.app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: .7rem;
    height: 100vh;
    padding: .8rem 1rem;
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 1.2rem; }
.top h1 { margin: 0; font-size: 1.35rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
.top h1 small { display: block; font-size: .7rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: .3rem; flex: 1; }
.tab {
    font: inherit; font-size: .76rem;
    padding: .34rem .62rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--ink);
    cursor: pointer;
}
.tab:hover { border-color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .adv { font-size: .65rem; font-weight: 700; color: var(--ref); margin-left: .3rem; }
.tab[aria-selected="true"] .adv { color: inherit; opacity: .75; }

/* ---------- main stage ---------- */
.stage {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 35fr) minmax(0, 65fr);
    gap: 1rem;
    min-height: 0;
}
.left { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: .7rem; min-height: 0; }
.right { display: flex; flex-direction: column; min-height: 0; }
.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .6rem;
    padding: .55rem .8rem;
    min-height: 0;
}
.panel-title {
    display: flex; justify-content: space-between; gap: 1rem;
    margin-bottom: .4rem;
    font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
}
.panel-title .note { text-transform: none; letter-spacing: 0; font-weight: 500; }

/* code */
.code-panel { background: var(--code-bg); border-color: var(--line); overflow: hidden; }
.code-panel .panel-title { color: var(--code-num); }
.code { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: .88rem; }
.code li {
    display: flex; gap: .7rem;
    padding: .13rem .5rem;
    border-left: 3px solid transparent; border-radius: .25rem;
    color: var(--code-ink);
    white-space: pre;
    transition: background .25s;
}
.code .ln { flex: none; width: 1.3rem; text-align: right; color: var(--code-num); }
.code li.active { background: var(--code-active); border-left-color: var(--code-marker); }
.code li.active.error { background: #4d2329; border-left-color: #ff6b63; }
.code .k { color: #c792ea; }
.code .s { color: #a5d986; }
.code .n { color: #f7b267; }
.code .c { color: #7a8299; font-style: italic; }
.code .o { color: #82aaff; }

/* expression evaluation */
.eval { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; align-items: center; }
.ev-k { font-size: .72rem; color: var(--muted); }
.ev-v {
    justify-self: start;
    min-width: 2rem; min-height: 1.6rem;
    padding: .1rem .5rem;
    border-radius: .3rem;
    font-family: var(--mono); font-size: 1rem;
    white-space: pre;
}
.ev-sub:not(:empty) { background: var(--read-bg); }
.ev-res:not(:empty) { background: var(--write-bg); font-weight: 700; }
.eval-empty { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); font-style: italic; min-height: 5.3rem; display: flex; align-items: center; }

/* console */
.console-panel { display: flex; flex-direction: column; }
.console { flex: 1; overflow: auto; font-family: var(--mono); font-size: .9rem; }
.cline { padding: .12rem .4rem; border-bottom: 1px solid var(--line); white-space: pre; }
.cline .prompt { color: var(--muted); margin-right: .5rem; }
.cline.err { color: var(--err); background: var(--err-bg); white-space: normal; }

/* ---------- memory ---------- */
.mem-wrap { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 1.2rem; }
.ram-panel { flex: none; align-self: flex-start; }
.mem-head {
    display: grid; grid-template-columns: var(--cols);
    height: 1.2rem; margin-bottom: .2rem;
    font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.mem-head span:first-child { text-align: right; padding-right: .7rem; }
.mem-head span:last-child { padding-left: .6rem; }
.slot { display: grid; grid-template-columns: var(--cols); align-items: center; height: var(--row-h); }
.addr { padding-right: .7rem; text-align: right; font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.cell {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    height: calc(var(--row-h) - .35rem);
    padding-top: .55rem;
    border: 2px solid; border-radius: .55rem;
    font-family: var(--mono); font-size: 1.08rem; font-weight: 700;
    overflow: hidden;
    transition: box-shadow .25s;
}
.free .cell { background: var(--free-bg); border-color: var(--free-border); border-style: dashed; }
.foreign .cell {
    background: repeating-linear-gradient(135deg, var(--foreign-bg) 0 .45rem, var(--foreign-bg2) .45rem .9rem);
    border-color: var(--foreign-border);
}
.foreign .cell, .free .cell, .dots .cell { padding-top: 0; }
.foreign .val { font-family: var(--sans); font-size: .7rem; font-weight: 600; color: var(--foreign-ink); }
.var .cell { background: var(--var-bg); border-color: var(--var-border); color: var(--var-ink); }
.dots .cell { border: 0; background: none; color: var(--muted); }
.type {
    position: absolute; top: .1rem; right: .4rem;
    font-family: var(--sans); font-size: .56rem; font-weight: 600; letter-spacing: .03em;
    opacity: .75;
}
.val.t-undefined, .val.t-null { font-style: italic; font-weight: 500; opacity: .85; }
.val.t-ref { color: var(--ref); }
.uninit { font-family: var(--sans); font-size: .68rem; font-style: italic; font-weight: 500; opacity: .7; }
.cell.hl-read, .box.hl-read  { box-shadow: 0 0 0 3px var(--read), 0 0 0 7px var(--read-bg); }
.cell.hl-write, .box.hl-write { box-shadow: 0 0 0 3px var(--write), 0 0 0 7px var(--write-bg); }
.cell.hl-new, .box.hl-new   { box-shadow: 0 0 0 3px var(--var-border); }
.cell.hl-error { box-shadow: 0 0 0 3px var(--err), 0 0 0 7px var(--err-bg); animation: shake .5s both; }
.label { position: relative; z-index: 4; display: flex; align-items: center; gap: .3rem; padding-left: .45rem; }
.ptr { flex: none; width: 1.4rem; height: .9rem; color: var(--muted); }
.name {
    padding: 0 .25rem; border-radius: .25rem;
    background: var(--panel);
    font-family: var(--mono); font-size: 1.05rem; font-weight: 700;
}
.kw {
    padding: 0 .3rem; border: 1px solid var(--line); border-radius: .25rem;
    background: var(--panel);
    font-family: var(--mono); font-size: .6rem; color: var(--muted);
}
.lock { flex: none; width: .9rem; height: .9rem; color: var(--muted); background: var(--panel); }
.ghost {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-top: .55rem;
    color: var(--muted); text-decoration: line-through;
    animation: ghost .9s ease-in both;
    pointer-events: none;
}
.box .ghost { padding-top: 0; }
.cell.changed .val, .box.changed .val, .pv.changed { animation: pop .45s .2s both; }
.slot.appear .cell, .slot.appear .label { animation: appear .5s both; }
.slot.appear .label { animation-delay: .15s; }

/* heap: array objects */
.heap-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.heap { position: relative; flex: 1; min-height: 0; }
.heap-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-style: italic; color: var(--muted); }
.harr {
    position: absolute; z-index: 2;
    padding: .3rem .6rem .4rem;
    border: 2px solid var(--heap-border); border-radius: .6rem;
    background: var(--heap-bg);
    font-family: var(--mono);
    transition: box-shadow .25s;
}
.harr.new { animation: fadein .5s both; }
.harr.visit { box-shadow: 0 0 0 3px var(--read), 0 0 0 7px var(--read-bg); }
.haddr { margin-bottom: .15rem; font-family: var(--sans); font-size: .68rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.haddr b { font-family: var(--mono); color: var(--ref); font-size: .82rem; }
.elems { display: flex; gap: .3rem; align-items: flex-end; }
.el { display: flex; flex-direction: column; align-items: center; gap: .08rem; }
.idx { margin-bottom: .25rem; font-size: .7rem; font-weight: 700; color: var(--muted); }
.box {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-width: 2.5rem; height: 1.95rem;
    padding: 0 .45rem;
    border: 2px solid var(--heap-border); border-radius: .35rem;
    background: var(--panel);
    font-size: .95rem; font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    transition: box-shadow .25s;
}
.eaddr { margin-top: .3rem; font-size: .56rem; color: var(--muted); }
.el.hole .box { border-style: dashed; background: transparent; }
.el.hole .val { font-family: var(--sans); font-size: .7rem; font-style: italic; font-weight: 500; color: var(--muted); }
.el.appear { animation: pop .45s both; }
.el.gone { animation: gone .7s .35s both; }
.el-none { height: 1.95rem; display: flex; align-items: center; font-family: var(--sans); font-size: .72rem; font-style: italic; color: var(--muted); }
.harr.vert .elems { flex-direction: column; align-items: stretch; gap: .25rem; }
.harr.vert .el { flex-direction: row; gap: .4rem; }
.harr.vert .idx { width: .7rem; margin: 0 .2rem 0 0; text-align: right; }
.harr.vert .box { flex: 1; }
.hprops { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .6rem; margin-top: .3rem; font-size: .8rem; }
.hp { white-space: nowrap; }
.hp .pv { display: inline-block; padding: 0 .2rem; border-radius: .25rem; font-weight: 700; }
.hp.extra { padding: 0 .35rem; border: 1px dashed var(--muted); border-radius: .3rem; }
.pv.hl-write { background: var(--write-bg); outline: 2px solid var(--write); }
.pv.hl-read { background: var(--read-bg); outline: 2px solid var(--read); }
.harr.garbage { opacity: .55; filter: grayscale(1); border-style: dashed; }
.harr .tag {
    position: absolute; top: -.7rem; right: .6rem;
    padding: .05rem .45rem; border-radius: .3rem;
    background: var(--err); color: #fff;
    font-family: var(--sans); font-size: .6rem; font-weight: 700;
}
.harr .tag.temp { background: var(--muted); }
.harr.collected { animation: collect .9s both; }

/* reference arrows */
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; overflow: visible; pointer-events: none; color: var(--ref); }
.refpath { fill: none; stroke: currentColor; stroke-width: 2.5; }
.refpath.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s both; }

/* legend */
.legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.1rem;
    margin-top: .6rem;
    font-size: .72rem; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.sw { width: .95rem; height: .95rem; border: 2px solid; border-radius: .25rem; }
.sw.foreign { background: var(--foreign-bg); border-color: var(--foreign-border); }
.sw.free { background: var(--free-bg); border-color: var(--free-border); border-style: dashed; }
.sw.var { background: var(--var-bg); border-color: var(--var-border); }
.sw.arr { background: var(--heap-bg); border-color: var(--heap-border); }
.sw.hole { background: none; border-color: var(--heap-border); border-style: dashed; }
.sw.read { background: var(--read-bg); border-color: var(--read); }
.sw.write { background: var(--write-bg); border-color: var(--write); }
.sw.ref { height: 0; border-width: 1.5px 0 0; border-radius: 0; border-color: var(--ref); width: 1.4rem; }

/* ---------- footer ---------- */
.bottom {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.4rem; align-items: center;
    padding: .65rem 1rem;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: .7rem;
}
.explain-meta { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .2rem; }
.explain-text { min-height: calc(1.08rem * 1.42 * 3); font-size: 1.08rem; line-height: 1.42; }
.explain-text code, .explain-text kbd {
    padding: .05rem .3rem; border-radius: .25rem;
    background: var(--inline-code);
    font-family: var(--mono); font-size: .92em;
}
.explain-text .r { color: var(--read); font-weight: 700; }
.explain-text .w { color: var(--write); font-weight: 700; }
.explain-text .e { color: var(--err); font-weight: 700; }
.explain-text.fresh { animation: fadein .35s both; }
.controls { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
.btns { display: flex; gap: .4rem; }
.btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .5rem .8rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--paper); color: var(--ink);
    font: inherit; font-size: .9rem;
    cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); padding-inline: 1.2rem; }
.btn:disabled { opacity: .35; cursor: default; }
.btn svg { width: 1rem; height: 1rem; fill: currentColor; }
.icon-btn { padding: .45rem; }
.progress { display: flex; gap: 3px; width: 24rem; }
.progress button { flex: 1; height: .5rem; padding: 0; border: 0; border-radius: 2px; background: var(--line); cursor: pointer; }
.progress button.done { background: var(--muted); }
.progress button.cur { background: var(--write); }
.hint { font-size: .66rem; color: var(--muted); }

/* flying values */
.fly {
    position: fixed; z-index: 50;
    padding: .15rem .55rem; border-radius: .45rem;
    background: var(--read); color: var(--chip-ink);
    font-family: var(--mono); font-size: 1.05rem; font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 .3rem .9rem rgba(0, 0, 0, .25);
    pointer-events: none;
}
.fly.write { background: var(--write); }
.fly.rejected { background: var(--err); }

.cell.await .val, .cell.await .type, .box.await .val { visibility: hidden; }
.ev-v.await, .cline.await, .pv.await { visibility: hidden; }
.land { animation: land .45s both; }

#selftest { position: fixed; left: 0; bottom: 0; z-index: 99; max-width: 100%; margin: 0; padding: .5rem; background: #000; color: #0f0; font-size: 12px; white-space: pre-wrap; }

@keyframes appear { from { opacity: 0; transform: translateX(-.6rem); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes land { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes ghost { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(70%) scale(.8); } }
@keyframes gone { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(.9rem) scale(.7); } }
@keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes collect { 0% { opacity: .55; transform: none; } 100% { opacity: 0; transform: scale(.6) rotate(-6deg); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(.3rem); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
}

/* narrow screens: stack everything and let the page scroll */
@media (max-width: 900px) {
    html { font-size: 14px; }
    body { height: auto; overflow: auto; }
    .app { height: auto; }
    .top { flex-wrap: wrap; }
    .stage { grid-template-columns: 1fr; }
    .mem-wrap { flex-wrap: wrap; }
    .heap { min-height: 26rem; }
    .bottom { grid-template-columns: 1fr; }
    .controls { align-items: stretch; }
    .progress { width: 100%; }
}
</style>
<style>
/* language switch (EN / BG) */
.lang-btn { text-decoration: none; font-weight: 700; font-size: .8rem; letter-spacing: .04em; }
.lang-btn:hover, .lang-btn:focus-visible { border-color: var(--read, currentColor); }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <h1>Arrays in memory <small>how JavaScript stores arrays, step by step</small></h1>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <a class="btn lang-btn" id="langBtn" href="bg/arraysInMemory.html" hreflang="bg" lang="bg" title="Bulgarian version" aria-label="Bulgarian version">BG</a>
        <button class="btn icon-btn" id="themeBtn" title="Light / dark theme" aria-label="Light / dark theme">
            <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5v11a5.5 5.5 0 0 1 0-11z"/></svg>
        </button>
    </header>

    <main class="stage" id="stage">
        <section class="left">
            <div class="panel code-panel">
                <div class="panel-title"><span>Code</span><span class="note" id="lineNote"></span></div>
                <ol class="code" id="code"></ol>
            </div>
            <div class="panel">
                <div class="panel-title"><span>Evaluating the expression</span></div>
                <div class="eval" id="eval"></div>
            </div>
            <div class="panel console-panel">
                <div class="panel-title"><span>Console</span></div>
                <div class="console" id="console"></div>
            </div>
        </section>
        <section class="right">
            <div class="mem-wrap">
                <div class="panel ram-panel">
                    <div class="panel-title"><span>Stack - the variables</span></div>
                    <div class="mem-head"><span>address</span><span>value</span><span>name</span></div>
                    <div id="ram"></div>
                </div>
                <div class="panel heap-panel">
                    <div class="panel-title"><span>Heap - the arrays (objects)</span><span class="note">the addresses are examples</span></div>
                    <div class="heap" id="heap"></div>
                </div>
            </div>
            <div class="legend" id="legend"></div>
        </section>
        <svg class="arrows" id="arrows" aria-hidden="true"></svg>
    </main>

    <footer class="bottom">
        <div>
            <div class="explain-meta" id="explainMeta"></div>
            <div class="explain-text" id="explain" aria-live="polite"></div>
        </div>
        <div class="controls">
            <div class="btns">
                <button class="btn icon-btn" id="firstBtn" title="To the start (Home)" aria-label="To the start">
                    <svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM13 3L6 8l7 5z"/></svg>
                </button>
                <button class="btn" id="prevBtn" title="Back (Left arrow)">
                    <svg viewBox="0 0 16 16"><path d="M11 3L4 8l7 5z"/></svg>Back
                </button>
                <button class="btn" id="playBtn" title="Auto-play (P)"></button>
                <button class="btn primary" id="nextBtn" title="Next (Right arrow or Space)">
                    Next<svg viewBox="0 0 16 16"><path d="M5 3l7 5-7 5z"/></svg>
                </button>
            </div>
            <div class="progress" id="progress"></div>
            <div class="hint">Keys: Left / Right arrows, Space, Home, P, 1-7</div>
        </div>
    </footer>
</div>
<div id="flyLayer"></div>

<script>
// MODEL-START
// ---------------------------------------------------------------------------
// Memory model
//   s.vars[name] = { slot, value, type, kind, ref }       - stack cells
//   s.heap[addr] = { elems, props, x, y, vert, tag, garbage }  - array objects
//     elems[i]: string literal ("'apple'", "2"), number = reference to the
//               array with that address, null = empty slot (hole)
//     props:    extra (non-index) properties, e.g. { '-1': '0', a: '10' }
//     length is always elems.length
// ---------------------------------------------------------------------------
const ADDR0 = 128000;   // address of the first stack row shown
const ADDR_STEP = 8;    // each cell / slot is drawn as 8 bytes
const FOREIGN = 2;      // stack rows already used by other code
const ROWS = 6;         // stack rows shown (plus a "..." row)

function typeOf(lit) {
    if (lit === 'undefined') return 'undefined';
    if (lit === 'null') return 'null';
    if (lit === 'true' || lit === 'false') return 'boolean';
    if (lit.startsWith("'") || lit.startsWith('"')) return 'string';
    return 'number';
}

// Helpers used by the scenario steps. Each one mutates the state `s`.
function decl(s, name, kind = 'let') {
    s.vars[name] = { slot: FOREIGN + s.order.length, value: null, type: null, kind, ref: null };
    s.order.push(name);
    s.hl[name] = 'new';
}
function set(s, name, lit) {
    Object.assign(s.vars[name], { value: lit, type: typeOf(lit), ref: null });
    s.hl[name] = 'write';
}
function setRef(s, name, addr) {
    Object.assign(s.vars[name], { value: String(addr), type: 'ref', ref: addr });
    s.hl[name] = 'write';
}
function read(s, ...names) { names.forEach(n => s.hl[n] = 'read'); }
function ev(s, src, sub = '', res = '', lab = 'values') { s.eval = { src, sub, res, lab }; }
function log(s, text, err = false) { s.console.push({ text, err }); }
// a new array object in the heap; pos = { x, y } in rem, vert = draw it as a column
function anew(s, addr, elems, pos) {
    s.heap[addr] = Object.assign({ elems, props: {}, x: 0, y: 0, vert: false, tag: '', garbage: false }, pos);
    s.hhl[addr] = 'new';
}
function visit(s, ...addrs) { addrs.forEach(a => s.hhl[a] = 'visit'); }
function aget(s, addr, i) { s.hhl[addr + '.' + i] = 'read'; }
function aset(s, addr, i, val) {
    const el = s.heap[addr].elems;
    const grows = i >= el.length;
    while (el.length < i) el.push(null);
    el[i] = val;
    s.hhl[addr + '.' + i] = 'write';
    if (grows) s.hhl[addr + '.length'] = 'write';
}
function alen(s, addr, n) {
    const el = s.heap[addr].elems;
    if (n < el.length) el.length = n;
    while (el.length < n) el.push(null);
    s.hhl[addr + '.length'] = 'write';
}
function lenRead(s, addr) { s.hhl[addr + '.length'] = 'read'; }
function aprop(s, addr, key, lit) { s.heap[addr].props[key] = lit; s.hhl[addr + '.p.' + key] = 'write'; }
// copy element `from` to `to` (used by unshift / shift)
function amove(s, addr, from, to) { aset(s, addr, to, s.heap[addr].elems[from]); }

// ---------------------------------------------------------------------------
// Scenarios
//   step.line    - active code line (0-based, -1 = none), or an array of lines
//   step.do      - changes to the memory state
//   step.fly     - values that fly on screen: [from, to, text, option]
//                  keys: v:name (stack cell), ev (values row), res (result row),
//                  con (last console line), ha:addr (array object),
//                  e:addr.i (element i), p:addr.prop (length or other property)
//   step.stagger - ms between flights (default 200)
//   step.reveal  - elements to keep hidden until all flights land
// ---------------------------------------------------------------------------
const SCENARIOS = [
{
    tab: 'Indexes',
    addrs: true,
    code: [
        "let fruits = ['apple', 'banana', 'strawberry'];",
        'console.log(fruits[0]);',
        "fruits[2] = 'orange';",
        'console.log(fruits.length);',
        'console.log(fruits[fruits.length - 1]);',
        'console.log(fruits);',
    ],
    steps: [
        { line: -1, text: `An array is a <b>compound</b> type: one value that holds many others - its <b>elements</b>. Each element has a sequence number - its <b>index</b>, which starts at 0. Arrays are objects, so we use the model from "Variables in memory": the <b>stack</b> for the variables and the <b>heap</b> for the objects.` },
        { line: 0, text: `First the right-hand side (RHS) is calculated: the literal <code>[...]</code> creates a new array in the heap. The elements are written <b>next to each other</b>, in consecutive slots: index 0 is at address 5000, index 1 at 5008, index 2 at 5016. The array also keeps the property <code>length</code> - the number of elements.`,
          do: s => anew(s, 5000, ["'apple'", "'banana'", "'strawberry'"], { x: .4, y: 1.5 }) },
        { line: 0, text: `The cell of fruits does <b>not</b> get the array itself, but its <b>address</b> - 5000. We say that fruits holds a <b>reference</b> to the array - the arrow.`,
          do: s => { decl(s, 'fruits'); setRef(s, 'fruits', 5000); }, fly: [['ha:5000', 'v:fruits', '5000']] },
        { line: 1, text: `<code>fruits[0]</code>: JavaScript <span class="r">reads</span> the address from fruits (5000) and goes to the array. The index says how many slots to skip from the start: the address of the element is 5000 + 0 * 8 = 5000. That is why the first element has index 0 - it is 0 slots from the start.`,
          do: s => { read(s, 'fruits'); visit(s, 5000); ev(s, 'fruits[0]', '5000 + 0 * 8 = 5000', '', 'address'); },
          fly: [['v:fruits', 'ha:5000', '5000']] },
        { line: 1, text: `The element at index 0 is <span class="r">read</span> - it is 'apple', and console.log prints it. (The quotes are not printed - they only show that the value is a string.)`,
          do: s => { aget(s, 5000, 0); ev(s, 'fruits[0]', '5000 + 0 * 8 = 5000', "'apple'", 'address'); log(s, 'apple'); },
          fly: [['e:5000.0', 'res', "'apple'"], ['e:5000.0', 'con', 'apple']] },
        { line: 2, text: `Writing by index: again the address is <span class="r">read</span> from fruits and the address of slot 2 is calculated: 5000 + 2 * 8 = 5016. JavaScript goes <b>directly</b> there, without walking through the elements before it - that is why access by index is equally fast for every index.`,
          do: s => { read(s, 'fruits'); visit(s, 5000); ev(s, "fruits[2] = 'orange'", '5000 + 2 * 8 = 5016', "'orange'", 'address'); },
          fly: [['v:fruits', 'ha:5000', '5000']] },
        { line: 2, text: `'orange' is <span class="w">written</span> into slot 2 and overwrites 'strawberry'. Note: fruits did not change - it still holds the address 5000. What changed is the <b>content</b> of the array.`,
          do: s => { ev(s, "fruits[2] = 'orange'", '5000 + 2 * 8 = 5016', "'orange'", 'address'); aset(s, 5000, 2, "'orange'"); },
          fly: [['res', 'e:5000.2', "'orange'"]] },
        { line: 3, text: `<code>fruits.length</code> - length is a <b>property</b> of the array. JavaScript does not count the elements each time, it simply <span class="r">reads</span> the stored number 3.`,
          do: s => { read(s, 'fruits'); lenRead(s, 5000); ev(s, 'fruits.length', '', '3'); log(s, '3'); },
          fly: [['p:5000.length', 'res', '3'], ['p:5000.length', 'con', '3']] },
        { line: 4, text: `The index here is an expression - first <code>fruits.length - 1</code> is calculated: length is 3, so the index is 3 - 1 = 2. What will this line print? Think before you go on.`,
          do: s => { lenRead(s, 5000); ev(s, 'fruits[fruits.length - 1]', 'fruits[3 - 1]'); },
          fly: [['p:5000.length', 'ev', '3']] },
        { line: 4, text: `orange is printed - the value we wrote a moment ago. The last element is always at index <code>length - 1</code>, because counting starts at 0.`,
          do: s => { aget(s, 5000, 2); ev(s, 'fruits[fruits.length - 1]', 'fruits[2]', "'orange'"); log(s, 'orange'); },
          fly: [['e:5000.2', 'res', "'orange'"], ['e:5000.2', 'con', 'orange']] },
        { line: 5, text: `<code>console.log(fruits)</code> follows the reference and prints the whole array. Node shows it as <code>[ 'apple', 'banana', 'orange' ]</code> - here the quotes show that the elements are strings.`,
          do: s => { read(s, 'fruits'); visit(s, 5000); log(s, "[ 'apple', 'banana', 'orange' ]"); },
          fly: [['ha:5000', 'con', '[...]']] },
        { line: -1, text: `<b>Summary:</b> the variable holds a <b>reference</b> to the array in the heap. The elements are placed one after the other, and the index is an <b>offset</b> from the start: <code>arr[i]</code> goes directly to the address "start + i * slot size". That is why indexes start at 0 and why access by index is fast.` },
    ],
},
{
    tab: 'Out of range',
    addrs: true,
    code: [
        'let arr = [2, 4, 6];',
        'console.log(arr[4]);',
        'arr[4] = 8;',
        'console.log(arr);',
        'console.log(arr.length);',
        'arr.length = 2;',
        'console.log(arr);',
        'if (arr.length = 0) {   // = instead of ===',
        "    console.log('Empty array!');",
        '}',
        'console.log(arr);',
    ],
    steps: [
        { line: -1, text: `What happens if we use an index that is outside the array? And if we write something into length? We will see that length is not just a counter, but a property that <b>controls</b> the array.` },
        { line: 0, text: `<code>let arr = [2, 4, 6];</code> - an array with 3 elements in the heap and a variable arr with a reference to it. The indexes are 0, 1 and 2, and length is 3.`,
          do: s => { anew(s, 5000, ['2', '4', '6'], { x: .4, y: 1.5 }); decl(s, 'arr'); setRef(s, 'arr', 5000); },
          fly: [['ha:5000', 'v:arr', '5000']] },
        { line: 1, text: `<code>arr[4]</code> - there is no element with index 4: the last index is 2. Will there be an error? What will this line print? Think before you go on.`,
          do: s => { read(s, 'arr'); visit(s, 5000); ev(s, 'arr[4]', '4 >= length (3)', '', 'check'); },
          fly: [['v:arr', 'ha:5000', '5000']] },
        { line: 1, text: `No error! When you read an index that does not exist, JavaScript returns <b>undefined</b>. The engine compares the index with length and does <b>not</b> read the memory after the array (address 5032 is not its own). In lower-level languages like C, such a read is a dangerous bug.`,
          do: s => { lenRead(s, 5000); ev(s, 'arr[4]', '4 >= length (3)', 'undefined', 'check'); log(s, 'undefined'); },
          fly: [['res', 'con', 'undefined']] },
        { line: 2, text: `When you <span class="w">write</span> to index 4, the array <b>grows</b>: 8 is written at index 4, and length becomes 5 (the biggest index + 1). The slot with index 3 stays <b>empty</b> - a "hole" in the array.`,
          do: s => { read(s, 'arr'); visit(s, 5000); ev(s, '8', '', '8'); aset(s, 5000, 4, '8'); },
          fly: [['res', 'e:5000.4', '8']] },
        { line: 3, text: `Node shows the hole as <code>&lt;1 empty item&gt;</code> (the Chrome console - as <code>empty</code>). If we read <code>arr[3]</code>, we get undefined, but the slot does not hold undefined - there is simply nothing in it.`,
          do: s => { read(s, 'arr'); visit(s, 5000); log(s, '[ 2, 4, 6, <1 empty item>, 8 ]'); },
          fly: [['ha:5000', 'con', '[...]']] },
        { line: 4, text: `length is 5, even though the array has only 4 values. That is why it is more exact to say that length is <b>the biggest index + 1</b>.`,
          do: s => { lenRead(s, 5000); ev(s, 'arr.length', '', '5'); log(s, '5'); },
          fly: [['p:5000.length', 'con', '5']] },
        { line: 5, text: `<span class="w">Writing</span> to length changes the array itself: all elements with index >= 2 are deleted. length is a <b>dynamic</b> property. (The opposite also works: for <code>[2, 4, 6]</code>, <code>arr.length = 5</code> adds empty slots - <code>[ 2, 4, 6, &lt;2 empty items&gt; ]</code>.)`,
          do: s => { ev(s, '2', '', '2'); alen(s, 5000, 2); },
          fly: [['res', 'p:5000.length', '2']] },
        { line: 6, text: `The array is now <code>[ 2, 4 ]</code>. The deleted elements are gone - if we now increase length, there will be empty slots in their place, not the old values.`,
          do: s => { read(s, 'arr'); visit(s, 5000); log(s, '[ 2, 4 ]'); },
          fly: [['ha:5000', 'con', '[...]']] },
        { line: 7, text: `<b>A common bug:</b> we wanted to check whether the array is empty, but we wrote <code>=</code> instead of <code>===</code>. What will this line do? Think before you go on.`,
          do: s => ev(s, 'arr.length = 0') },
        { line: 7, text: `<code>=</code> is <b>assignment</b>: 0 is <span class="w">written</span> into length and all elements are deleted! The value of the whole expression is the written number 0, which counts as false in a condition.`,
          do: s => { ev(s, 'arr.length = 0', '', '0'); alen(s, 5000, 0); },
          fly: [['res', 'p:5000.length', '0']] },
        { line: 10, text: `The body of the if is skipped, so 'Empty array!' is not printed. And <code>console.log(arr)</code> shows <code>[]</code> - the data is lost, without any error. The right check is <code>if (arr.length === 0)</code>.`,
          do: s => { read(s, 'arr'); visit(s, 5000); log(s, '[]'); },
          fly: [['ha:5000', 'con', '[]']] },
        { line: -1, text: `<b>Summary:</b> reading outside the array returns undefined (no error); writing outside the array makes it bigger and can leave empty slots; length is the biggest index + 1, and writing to length makes the array shorter or longer. For comparison - <code>===</code>, never <code>=</code>.` },
    ],
},
{
    tab: 'An array is an object',
    addrs: true,
    code: [
        'let arr = [2, 4, 6];',
        'console.log(typeof arr);',
        'arr[-1] = 0;',
        "arr['a'] = 10;",
        'console.log(arr.length);',
        'console.log(arr);',
        "console.log(arr[1], arr['1']);",
        'console.log(arr.lenght);',
    ],
    steps: [
        { line: -1, text: `In JavaScript, arrays are <b>objects</b> - a special kind of object in which the keys 0, 1, 2... are indexes, and length takes care of them. That is why some "wrong" things give no error, but do something unexpected.` },
        { line: 0, text: `<code>let arr = [2, 4, 6];</code> - an array in the heap and a reference to it in arr.`,
          do: s => { anew(s, 5000, ['2', '4', '6'], { x: .4, y: 1.5 }); decl(s, 'arr'); setRef(s, 'arr', 5000); },
          fly: [['ha:5000', 'v:arr', '5000']] },
        { line: 1, text: `<code>typeof arr</code> returns "object" - there is no separate type for arrays. To check whether a value is an array, use <code>Array.isArray(arr)</code> - it returns true.`,
          do: s => { read(s, 'arr'); ev(s, 'typeof arr', '', '"object"'); log(s, 'object'); },
          fly: [['v:arr', 'res', '5000']], reveal: ['res', 'con'] },
        { line: 2, text: `The keys of objects are actually <b>strings</b>: -1 becomes '-1'. But '-1' is not a valid index (indexes are whole numbers >= 0), so an ordinary <b>property</b> named '-1' is created - outside the elements. There is no error.`,
          do: s => { read(s, 'arr'); visit(s, 5000); ev(s, 'arr[-1] = 0', "key '-1' - not an index", '0', 'key'); aprop(s, 5000, '-1', '0'); },
          fly: [['res', 'p:5000.-1', '0']] },
        { line: 3, text: `The same with <code>arr['a']</code>: 'a' is not an index, but a property name. Note that length stays 3 - properties are not elements.`,
          do: s => { read(s, 'arr'); visit(s, 5000); ev(s, "arr['a'] = 10", "key 'a' - not an index", '10', 'key'); aprop(s, 5000, 'a', '10'); },
          fly: [['res', 'p:5000.a', '10']] },
        { line: 4, text: `3 is printed. length counts only the indexed elements - '-1' and 'a' are not counted.`,
          do: s => { lenRead(s, 5000); ev(s, 'arr.length', '', '3'); log(s, '3'); },
          fly: [['p:5000.length', 'con', '3']] },
        { line: 5, text: `Node prints the elements first, and after them the extra properties in the form <code>key: value</code>: <code>[ 2, 4, 6, '-1': 0, a: 10 ]</code>.`,
          do: s => { read(s, 'arr'); visit(s, 5000); log(s, "[ 2, 4, 6, '-1': 0, a: 10 ]"); },
          fly: [['ha:5000', 'con', '[...]']] },
        { line: 6, text: `<code>arr[1]</code> and <code>arr['1']</code> - is there a difference? Think before you go on.`,
          do: s => { ev(s, "arr[1], arr['1']", "key '1', key '1'", '', 'key'); } },
        { line: 6, text: `There is no difference: 4 4 is printed. The number 1 also becomes the key '1'. Indexes are just keys that look like whole numbers >= 0 - '0', '1', '2'... The array treats them in a special way: it keeps them in order and updates length.`,
          do: s => { aget(s, 5000, 1); ev(s, "arr[1], arr['1']", "key '1', key '1'", '4, 4', 'key'); log(s, '4 4'); },
          fly: [['e:5000.1', 'con', '4'], ['e:5000.1', 'con', '4']] },
        { line: 7, text: `A spelling mistake: <code>lenght</code> instead of <code>length</code>. JavaScript looks for the property 'lenght' (in the array and in its prototype - more on that in the topic about objects), does not find it and returns <b>undefined</b>, with no error. That is why <code>if (arr.lenght)</code> always goes to else.`,
          do: s => { read(s, 'arr'); visit(s, 5000); ev(s, 'arr.lenght', "key 'lenght' - not there", 'undefined', 'key'); log(s, 'undefined'); },
          fly: [['res', 'con', 'undefined']] },
        { line: -1, text: `<b>Summary:</b> an array is an object. The indexes are the keys '0', '1', '2'..., length is a property, and any other key ('-1', 'a', 'lenght') is an ordinary property that is not counted in length. JavaScript gives no error - that is why such bugs are hard to find.` },
    ],
},
{
    tab: 'push / pop / unshift / shift',
    addrs: true,
    code: [
        "let fruits = ['apple', 'banana', 'strawberry'];",
        "fruits.push('lemon');",
        'console.log(fruits.pop());',
        "fruits.unshift('orange');",
        'console.log(fruits.shift());',
        'console.log(fruits);',
    ],
    steps: [
        { line: -1, text: `These four methods add and remove elements at the two ends of the array. The result looks symmetric, but the work "under the hood" is very different. Watch how many elements <b>move</b>.` },
        { line: 0, text: `An array with 3 elements and a reference to it in fruits.`,
          do: s => { anew(s, 5000, ["'apple'", "'banana'", "'strawberry'"], { x: .4, y: 1.5 }); decl(s, 'fruits'); setRef(s, 'fruits', 5000); },
          fly: [['ha:5000', 'v:fruits', '5000']] },
        { line: 1, text: `<code>push</code> adds at the <b>end</b>: the new element goes to index length (3), and length becomes 4. Only <b>one</b> slot is touched, nothing moves. (The engine reserves some extra space; when it runs out, it copies the array to a bigger place - but that happens rarely.)`,
          do: s => { read(s, 'fruits'); visit(s, 5000); ev(s, "fruits.push('lemon')", '0', '4', 'moves'); aset(s, 5000, 3, "'lemon'"); },
          fly: [['v:fruits', 'ha:5000', '5000'], ['ev', 'e:5000.3', "'lemon'"]] },
        { line: 2, text: `<code>pop</code> removes the <b>last</b> element and returns it - lemon is printed. length becomes 3. Again we touch only the end: 0 moves.`,
          do: s => { aget(s, 5000, 3); alen(s, 5000, 3); ev(s, 'fruits.pop()', '0', "'lemon'", 'moves'); log(s, 'lemon'); },
          fly: [['e:5000.3', 'res', "'lemon'"], ['e:5000.3', 'con', 'lemon']] },
        { line: 3, text: `<code>unshift</code> adds at the <b>start</b>. But there is already an element at index 0! So first <b>every</b> element is copied one position to the right, starting from the end: 3 moves. length becomes 4.`,
          do: s => { ev(s, "fruits.unshift('orange')", '3', '', 'moves'); amove(s, 5000, 2, 3); amove(s, 5000, 1, 2); amove(s, 5000, 0, 1); },
          stagger: 550,
          fly: [['e:5000.2', 'e:5000.3', "'strawberry'"], ['e:5000.1', 'e:5000.2', "'banana'"], ['e:5000.0', 'e:5000.1', "'apple'"]] },
        { line: 3, text: `Now 'orange' is <span class="w">written</span> into the freed index 0. All the old elements got a <b>new index</b>: 'apple' is now <code>fruits[1]</code>. unshift returns the new length - 4.`,
          do: s => { ev(s, "fruits.unshift('orange')", '3', '4', 'moves'); aset(s, 5000, 0, "'orange'"); },
          fly: [['ev', 'e:5000.0', "'orange'"]], reveal: ['res'] },
        { line: 4, text: `<code>shift</code> removes the <b>first</b> element. First the value 'orange' is remembered, so that it can be returned...`,
          do: s => { read(s, 'fruits'); visit(s, 5000); aget(s, 5000, 0); ev(s, 'fruits.shift()', '0', "'orange'", 'moves'); },
          fly: [['e:5000.0', 'res', "'orange'"]] },
        { line: 4, text: `...then every following element is copied one position to the left, starting from the start: 3 moves again.`,
          do: s => { ev(s, 'fruits.shift()', '3', "'orange'", 'moves'); amove(s, 5000, 1, 0); amove(s, 5000, 2, 1); amove(s, 5000, 3, 2); },
          stagger: 550,

// ---------------------------------------------------------------------------
// State replay: state[i] is the memory after step i
// ---------------------------------------------------------------------------
function computeStates(sc) {
    let s = { line: -1, vars: {}, order: [], heap: {}, eval: null, console: [], hl: {}, hhl: {}, err: false };
    return sc.steps.map(step => {
        s = JSON.parse(JSON.stringify(s));
        s.hl = {}; s.hhl = {}; s.err = false; s.eval = null;
        s.line = step.line;
        if (step.do) step.do(s);
        return s;
    });
}

const $ = (sel, root = document) => root.querySelector(sel);
const FLY_MS = 820, STAGGER = 200;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON_PTR = '<svg class="ptr" viewBox="0 0 24 14"><path d="M1 7 L8 1 V4.5 H23 V9.5 H8 V13 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const ICON_LOCK = '<svg class="lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z"/></svg>Play';
const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>Pause';

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

const TOKENS = /(\/\/.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(let|const|if|else|typeof|null|undefined|true|false)\b|(\b\d+(?:\.\d+)?\b)|\b(console)\b/g;
function highlight(line) {
    let out = '', last = 0;
    line.replace(TOKENS, (m, c, str, k, n, o, idx) => {
        out += esc(line.slice(last, idx));
        const cls = c ? 'c' : str ? 's' : k ? 'k' : n ? 'n' : 'o';
        out += `<span class="${cls}">${esc(m)}</span>`;
        last = idx + m.length;
        return m;
    });
    return out + esc(line.slice(last));
}

const lines = s => Array.isArray(s.line) ? s.line : [s.line];

// where each flight lands, and when (ms), so ghosts and arrows wait for it
function landings(step) {
    const map = new Map();
    const st = step.stagger || STAGGER;
    (step.fly || []).forEach(([, to], i) => { if (!map.has(to)) map.set(to, FLY_MS + i * st); });
    return map;
}

function renderCode(sc, s) {
    const act = lines(s);
    $('#code').innerHTML = sc.code.map((l, i) => {
        const on = act.includes(i);
        return `<li class="${on ? 'active' : ''} ${on && s.err ? 'error' : ''}"><span class="ln">${i + 1}</span><span>${highlight(l)}</span></li>`;
    }).join('');
    const first = act[0];
    $('#lineNote').textContent = first < 0 ? '' : act.length > 1 ? `running lines ${act[0] + 1}-${act[act.length - 1] + 1}` : `running line ${first + 1}`;
}

function renderRam(sc, s, prev, step) {
    const bySlot = {};
    s.order.forEach(n => bySlot[s.vars[n].slot] = n);
    const land = prev ? landings(step) : new Map();
    let html = '';
    for (let i = 0; i < ROWS; i++) {
        const addr = ADDR0 + i * ADDR_STEP;
        const name = bySlot[i];
        if (i < FOREIGN) {
            html += `<div class="slot foreign"><span class="addr">${addr}</span><div class="cell"><span class="val">taken</span></div><div></div></div>`;
            continue;
        }
        if (!name) {
            html += `<div class="slot free"><span class="addr">${addr}</span><div class="cell"></div><div></div></div>`;
            continue;
        }
        const v = s.vars[name];
        const pv = prev && prev.vars[name];
        const rowCls = ['slot', 'var'];
        const cellCls = ['cell'];
        if (s.hl[name]) cellCls.push('hl-' + s.hl[name]);
        const delay = land.get('v:' + name);
        let ghost = '';
        if (prev) {
            if (!pv) rowCls.push('appear');
            else if (pv.value !== null && pv.value !== v.value) {
                ghost = `<span class="ghost" style="animation-delay:${delay || 0}ms">${esc(pv.value)}</span>`;
                if (!delay) cellCls.push('changed');
            } else if (pv.value === null && v.value !== null && !delay) cellCls.push('changed');
        }
        const errDelay = s.hl[name] === 'error' && delay ? ` style="animation-delay:${delay}ms"` : '';
        const val = v.value === null
            ? '<span class="val uninit">uninitialised</span>'
            : `<span class="val t-${v.type}">${esc(v.value)}</span><span class="type">${v.type === 'ref' ? 'reference' : v.type}</span>`;
        html += `<div class="${rowCls.join(' ')}" data-var="${name}">
            <span class="addr">${addr}</span>
            <div class="${cellCls.join(' ')}"${errDelay}>${ghost}${val}</div>
            <div class="label">${ICON_PTR}<span class="name">${esc(name)}</span>${v.kind === 'const' ? ICON_LOCK : ''}<span class="kw">${v.kind}</span></div>
        </div>`;
    }
    html += `<div class="slot dots"><span class="addr">...</span><div class="cell">...</div><div></div></div>`;
    $('#ram').innerHTML = html;
}

const disp = e => e === null ? 'empty' : typeof e === 'number' ? String(e) : e;
const elType = e => e === null ? 'hole' : typeof e === 'number' ? 'ref' : typeOf(e);
const keyName = k => /^[A-Za-z_$][\w$]*$/.test(k) ? k : `'${k}'`;

function renderHeap(sc, s, prev, step) {

        for (let i = 0; i < n; i++) {
            const gone = i >= o.elems.length;
            const e = gone ? po.elems[i] : o.elems[i];
            const key = addr + '.' + i;
            const elCls = ['el'];
            if (e === null) elCls.push('hole');
            if (gone) elCls.push('gone');
            else if (po && i >= po.elems.length) elCls.push('appear');
            const boxCls = ['box'];
            if (!gone && s.hhl[key]) boxCls.push('hl-' + s.hhl[key]);
            const delay = land.get('e:' + key);
            let ghost = '';
            if (po && !gone && i < po.elems.length && po.elems[i] !== e) {
                if (po.elems[i] !== null) ghost = `<span class="ghost" style="animation-delay:${delay || 0}ms">${esc(disp(po.elems[i]))}</span>`;
                if (!delay) boxCls.push('changed');
            } else if (po && !gone && i >= po.elems.length && !delay) boxCls.push('changed');
            els += `<div class="${elCls.join(' ')}" data-i="${i}">
                <span class="idx">${i}</span>
                <span class="${boxCls.join(' ')}">${ghost}<span class="val t-${elType(e)}">${esc(disp(e))}</span></span>
                ${sc.addrs && !o.vert ? `<span class="eaddr">${+addr + i * ADDR_STEP}</span>` : ''}
            </div>`;
        }
        if (!n) els = '<div class="el-none">no elements</div>';
        const pcls = k => {
            const h = s.hhl[addr + (k === 'length' ? '.length' : '.p.' + k)];

            if (h) c.push('hl-' + h);
            const d = land.get('p:' + addr + '.' + k);
            const pval = k === 'length' ? (po && po.elems.length) : (po && po.props[k]);
            const val = k === 'length' ? o.elems.length : o.props[k];
            if (po && pval !== val && !d) c.push('changed');
            return c.join(' ');
        };
        let props = `<span class="hp" data-prop="length">length: <b class="${pcls('length')}">${o.elems.length}</b></span>`;
        for (const [k, v] of Object.entries(o.props)) {
            props += `<span class="hp extra" data-prop="${esc(k)}" title="a property, not an element">${esc(keyName(k))}: <b class="${pcls(k)}">${esc(v)}</b></span>`;
        }
        const tag = o.garbage ? '<span class="tag">unreachable</span>' : o.tag ? `<span class="tag temp">${esc(o.tag)}</span>` : '';
        return `<div class="${cls.join(' ')}" data-addr="${addr}" style="left:${o.x}rem; top:${o.y}rem">

            <div class="haddr">array, address <b>${addr}</b></div>
            <div class="elems">${els}</div>
            <div class="hprops">${props}</div>
        </div>`;
    };
    let html = '';
    for (const [addr, o] of Object.entries(s.heap)) {
        const po = prev && prev.heap[addr];
        const cls = [];
        if (o.garbage) cls.push('garbage');
        if (s.hhl[addr] === 'visit') cls.push('visit');
        if (prev && !po) cls.push('new');
        html += card(addr, o, po, cls.join(' '));
    }
    if (prev) {
        for (const [addr, o] of Object.entries(prev.heap)) {
            if (!s.heap[addr]) html += card(addr, o, null, 'garbage collected');
        }
    }
    if (!html) html = '<div class="heap-empty">The arrays will appear here.</div>';
    $('#heap').innerHTML = html;
}

function renderEval(s) {
    const e = s.eval;
    $('#eval').innerHTML = e
        ? `<span class="ev-k">expression</span><code class="ev-v ev-src">${esc(e.src)}</code>
           <span class="ev-k">${esc(e.lab)}</span><code class="ev-v ev-sub">${esc(e.sub)}</code>
           <span class="ev-k">result</span><code class="ev-v ev-res">${esc(e.res)}</code>`
        : `<div class="eval-empty">Here we will see how the expression is calculated - for example the address of an element by its index.</div>`;
}

function renderConsole(s) {
    const box = $('#console');
    box.innerHTML = s.console.map(l =>
        `<div class="cline ${l.err ? 'err' : ''}"><span class="prompt">&gt;</span>${esc(l.text)}</div>`).join('');
    box.scrollTop = box.scrollHeight;
}

function renderLegend(sc) {
    $('#legend').innerHTML = [
        '<span><i class="sw foreign"></i>taken</span>',
        '<span><i class="sw free"></i>free</span>',
        '<span><i class="sw var"></i>variable</span>',
        '<span><i class="sw arr"></i>array (object in the heap)</span>',
        sc.addrs ? '<span><i class="sw hole"></i>empty slot</span>' : '',
        '<span><i class="sw read"></i>read</span>',
        '<span><i class="sw write"></i>write</span>',
        '<span><i class="sw ref"></i>reference</span>',
    ].join('');
}

function drawArrows(s, step, animate) {
    const svg = $('#arrows');
    const base = $('#stage').getBoundingClientRect();
    const land = animate ? landings(step) : new Map();
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    let html = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>';
    const arrow = (from, ref, key, isNew) => {
        const obj = $(`#heap .harr[data-addr="${ref}"]`);
        if (!from || !obj) return;
        const a = from.getBoundingClientRect(), b = obj.getBoundingClientRect();
        const x1 = a.right - base.left - .7 * rem, y1 = a.top + a.height / 2 - base.top;
        const x2 = b.left - base.left - 2, y2 = b.top + Math.min(b.height / 2, 1.9 * rem) - base.top;
        const dx = Math.max(40, (x2 - x1) / 2);
        const d = land.get(key);
        const fresh = d !== undefined || isNew;
        const delay = d !== undefined ? `style="animation-delay:${d}ms"` : '';
        html += `<circle cx="${x1}" cy="${y1}" r="4" fill="currentColor"/>
                 <path class="refpath ${fresh ? 'draw' : ''}" ${delay} pathLength="1" marker-end="url(#ah)"
                       d="M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}"/>`;
    };
    for (const name of s.order) {
        const v = s.vars[name];
        if (v.ref === null || !s.heap[v.ref]) continue;
        arrow($(`#ram .slot[data-var="${name}"] .cell`), v.ref, 'v:' + name, false);
    }
    for (const [addr, o] of Object.entries(s.heap)) {
        o.elems.forEach((e, i) => {
            if (typeof e !== 'number' || !s.heap[e]) return;
            arrow($(`#heap .harr[data-addr="${addr}"] .el[data-i="${i}"] .box`), e, `e:${addr}.${i}`, animate && s.hhl[addr] === 'new');
        });
    }
    svg.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Flying values
// ---------------------------------------------------------------------------
function resolve(key) {
    if (key === 'ev') return $('#eval .ev-sub');
    if (key === 'res') return $('#eval .ev-res');
    if (key === 'con') return $('#console .cline:last-child');
    const i = key.indexOf(':');
    const kind = key.slice(0, i), rest = key.slice(i + 1);
    if (kind === 'v') return $(`#ram .slot[data-var="${rest}"] .cell`);
    if (kind === 'ha') return $(`#heap .harr[data-addr="${rest}"] .haddr`);
    const dot = rest.indexOf('.');
    const addr = rest.slice(0, dot), sub = rest.slice(dot + 1);
    if (kind === 'e') return $(`#heap .harr[data-addr="${addr}"] .el[data-i="${sub}"] .box`);
    if (kind === 'p') return $(`#heap .harr[data-addr="${addr}"] .hp[data-prop="${sub}"] .pv`);
    return null;
}

function bump(el) {
    el.classList.remove('land');
    void el.offsetWidth;
    el.classList.add('land');
}

function playFlights(step, tk) {
    const flights = step.fly || [];
    if (!flights.length || reduceMotion) return;
    const layer = $('#flyLayer');
    const stagger = step.stagger || STAGGER;
    const pending = new Map();
    const revealKeys = step.reveal || (flights.some(f => f[1] === 'ev') ? ['res'] : []);
    const revealEls = revealKeys.map(resolve).filter(Boolean);
    revealEls.forEach(el => el.classList.add('await'));

    const plan = flights.map(([from, to, text, opt], i) => {
        const src = resolve(from), dst = resolve(to);
        const awaits = !!dst && opt !== 'reject' && !to.startsWith('ha:');
        if (awaits) {
            dst.classList.add('await');
            pending.set(dst, (pending.get(dst) || 0) + 1);
        }
        return { src, dst, to, text, opt, i, awaits };
    });

    let left = plan.length;
    for (const p of plan) {
        const finish = () => {
            if (tk !== token) return;
            if (p.awaits) {
                const c = pending.get(p.dst) - 1;
                pending.set(p.dst, c);
                if (c === 0) { p.dst.classList.remove('await'); bump(p.dst); }
            }
            if (--left === 0) revealEls.forEach(el => { el.classList.remove('await'); bump(el); });
        };
        if (!p.src || !p.dst) { finish(); continue; }

        const a = p.src.getBoundingClientRect(), b = p.dst.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'fly ' + (/^(v|e|p):/.test(p.to) ? 'write' : 'read');
        chip.textContent = p.text;
        layer.appendChild(chip);
        const w = chip.offsetWidth, h = chip.offsetHeight;
        const x0 = a.left + a.width / 2 - w / 2, y0 = a.top + a.height / 2 - h / 2;
        const dx = b.left + b.width / 2 - w / 2 - x0, dy = b.top + b.height / 2 - h / 2 - y0;
        const lift = Math.min(90, 30 + Math.hypot(dx, dy) * .15);
        chip.style.left = x0 + 'px';
        chip.style.top = y0 + 'px';
        const anim = chip.animate([
            { transform: 'translate(0,0) scale(.85)', opacity: 0 },
            { transform: 'translate(0,0) scale(1)', opacity: 1, offset: .12 },
            { transform: `translate(${dx / 2}px,${dy / 2 - lift}px) scale(1.15)`, opacity: 1, offset: .55 },
            { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: 1 },
        ], { duration: FLY_MS, delay: p.i * stagger, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
        anim.onfinish = () => {
            if (p.opt !== 'reject') { chip.remove(); finish(); return; }
            // the value bounces off a const cell
            chip.classList.add('rejected');
            chip.animate([
                { transform: `translate(${dx}px,${dy}px)` },
                { transform: `translate(${dx + 8}px,${dy}px)` },
                { transform: `translate(${dx - 8}px,${dy}px)` },
                { transform: `translate(${dx}px,${dy + 40}px)`, opacity: 0 },
            ], { duration: 700, fill: 'both' }).onfinish = () => { chip.remove(); finish(); };
        };
    }
}

// ---------------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------------
let scIdx = 0, stepIdx = 0, states = [], playing = false, autoTimer = null, token = 0;

function render(animate) {
    const sc = SCENARIOS[scIdx];
    const step = sc.steps[stepIdx];
    const s = states[stepIdx];
    const prev = animate && stepIdx > 0 ? states[stepIdx - 1] : null;
    const tk = ++token;
    $('#flyLayer').innerHTML = '';

    renderCode(sc, s);
    renderRam(sc, s, prev, step);
    renderHeap(sc, s, prev, step);
    renderEval(s);
    renderConsole(s);

    const N = sc.steps.length;
    $('#explainMeta').textContent = `Step ${stepIdx + 1} of ${N}`;
    const ex = $('#explain');
    ex.innerHTML = step.text;
    ex.classList.remove('fresh'); void ex.offsetWidth; ex.classList.add('fresh');

    $('#progress').innerHTML = sc.steps.map((_, i) =>
        `<button class="${i < stepIdx ? 'done' : i === stepIdx ? 'cur' : ''}" data-i="${i}" title="Step ${i + 1}" aria-label="Step ${i + 1}"></button>`).join('');
    $('#firstBtn').disabled = $('#prevBtn').disabled = stepIdx === 0;
    $('#nextBtn').disabled = stepIdx === N - 1;
    $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;

    requestAnimationFrame(() => {
        if (tk !== token) return;
        drawArrows(s, step, !!prev);
        if (prev) playFlights(step, tk);
    });
    scheduleAuto();
}

function goto(i, animate = false) {
    const N = SCENARIOS[scIdx].steps.length;
    stepIdx = Math.max(0, Math.min(N - 1, i));
    if (!selfTesting) {
        try { history.replaceState(null, '', `#${scIdx + 1}.${stepIdx + 1}`); } catch (e) { /* file:// in some browsers */ }
    }
    render(animate);
}
function next() {
    if (stepIdx < SCENARIOS[scIdx].steps.length - 1) goto(stepIdx + 1, true);
    else setPlaying(false);
}
function prev() { goto(stepIdx - 1); }

function setPlaying(on) {
    playing = on;
    $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    if (playing && stepIdx === SCENARIOS[scIdx].steps.length - 1) goto(0);
    else if (playing) next();
    else clearTimeout(autoTimer);
}
function scheduleAuto() {
    clearTimeout(autoTimer);
    if (!playing) return;
    const sc = SCENARIOS[scIdx];
    if (stepIdx >= sc.steps.length - 1) { playing = false; $('#playBtn').innerHTML = ICON_PLAY; return; }
    const len = sc.steps[stepIdx].text.replace(/<[^>]+>/g, '').length;
    autoTimer = setTimeout(next, Math.min(10000, Math.max(2800, 1200 + len * 40)));
}

function selectScenario(i, step = 0) {
    scIdx = Math.max(0, Math.min(SCENARIOS.length - 1, i));
    states = computeStates(SCENARIOS[scIdx]);
    document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', j === scIdx));
    renderLegend(SCENARIOS[scIdx]);
    playing = false;
    goto(step);
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
let selfTesting = false;
$('#tabs').innerHTML = SCENARIOS.map((sc, i) =>
    `<button class="tab" role="tab" data-i="${i}">${i + 1}. ${esc(sc.tab)}${sc.advanced ? '<span class="adv">advanced</span>' : ''}</button>`).join('');
$('#tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) selectScenario(+t.dataset.i);
});
$('#progress').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { setPlaying(false); goto(+b.dataset.i); }
});
$('#nextBtn').addEventListener('click', next);
$('#prevBtn').addEventListener('click', () => { setPlaying(false); prev(); });
$('#firstBtn').addEventListener('click', () => { setPlaying(false); goto(0); });
$('#playBtn').addEventListener('click', () => setPlaying(!playing));
// keep focus off the buttons, so Space always means "next step"
document.querySelectorAll('.btn, .tab').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));

document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (onButton && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); setPlaying(false); prev(); }
    else if (e.key === 'Home') { e.preventDefault(); setPlaying(false); goto(0); }
    else if (e.key === 'p' || e.key === 'P') setPlaying(!playing);
    else if (/^[1-9]$/.test(e.key) && +e.key <= SCENARIOS.length) selectScenario(+e.key - 1);
});

$('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.dataset.theme
        ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = isDark ? 'light' : 'dark';
    try { localStorage.setItem('varsInMemoryTheme', root.dataset.theme); } catch (e) { /* storage blocked */ }
});
try {
    const t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('varsInMemoryTheme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
} catch (e) { /* storage blocked */ }

// arrows are positioned in pixels, so redraw them when the layout changes
new ResizeObserver(() => drawArrows(states[stepIdx], SCENARIOS[scIdx].steps[stepIdx], false)).observe($('#stage'));

// #selftest: render every step of every scenario and check that all flight endpoints exist
function selfTest() {
    selfTesting = true;
    const problems = [];
    let count = 0;
    window.addEventListener('error', e => problems.push('JS error: ' + e.message));
    SCENARIOS.forEach((sc, i) => {
        try {
            selectScenario(i);
            sc.steps.forEach((step, j) => {
                goto(j, j > 0);
                count++;
                for (const [from, to] of step.fly || []) {
                    if (!resolve(from)) problems.push(`#${i + 1}.${j + 1}: no element for ${from}`);
                    if (!resolve(to)) problems.push(`#${i + 1}.${j + 1}: no element for ${to}`);
                }
                if ($('#stage').scrollHeight > $('#stage').clientHeight + 2) problems.push(`#${i + 1}.${j + 1}: stage overflows`);
                for (const c of document.querySelectorAll('#heap .harr')) {
                    const hb = $('#heap').getBoundingClientRect(), cb = c.getBoundingClientRect();
                    if (cb.right > hb.right + 2 || cb.bottom > hb.bottom + 2) problems.push(`#${i + 1}.${j + 1}: array ${c.dataset.addr} outside heap`);
                }
            });
        } catch (e) { problems.push(`#${i + 1}: ${e.message}`); }
    });
    const out = document.createElement('pre');
    out.id = 'selftest';
    out.textContent = `SELFTEST ${problems.length ? 'FAIL' : 'OK'} - ${count} steps\n` + problems.join('\n');
    document.body.appendChild(out);
    document.title = 'SELFTEST ' + (problems.length ? 'FAIL' : 'OK');
    selfTesting = false;
}

function fromHash() {
    const h = location.hash.slice(1);
    if (h === 'selftest') return selfTest();
    const [a, b] = h.split('.');
    selectScenario((parseInt(a, 10) || 1) - 1, (parseInt(b, 10) || 1) - 1);
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
<script>
// language switch: keep the current scenario / step (#N.M) and theme
(function () {
    var a = document.getElementById('langBtn');
    if (!a) return;
    var base = a.getAttribute('href');
    a.addEventListener('click', function () {
        var t = document.documentElement.dataset.theme;
        a.href = base + (t === 'light' || t === 'dark' ? '?theme=' + t : '') + location.hash;
    });
})();
</script>
