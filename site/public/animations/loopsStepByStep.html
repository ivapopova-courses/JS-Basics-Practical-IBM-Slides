<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loops step by step</title>
<!--
    Step-by-step animation: how JavaScript walks through if / switch and loops.
    The same glowing token moves through the code and through the flowchart.
    Self-contained (no external files), so it works offline and inside an iframe.
    Deep links: loopsStepByStep.html#3 (scenario 3), #3.5 (scenario 3, step 5),
    ?theme=dark or ?theme=light, #selftest (walks every step and reports).
-->
<style>
:root {
    --paper: #f3eee3;
    --panel: #fffcf5;
    --ink: #26221c;
    --muted: #786f61;
    --line: #ddd3c1;
    --inline-code: #ece5d6;

    --code-bg: #22252f;
    --code-ink: #e9e6dd;
    --code-num: #6c7285;
    --code-active: #363d52;
    --code-marker: #ffd166;

    --var-bg: #c4e3b8;
    --var-border: #4f8a45;
    --var-ink: #18330f;
    --free-bg: #efe9dc;
    --free-border: #cfc4af;

    --read: #2563c9;
    --read-bg: #dbe7fb;
    --write: #d66d08;
    --write-bg: #fde5c8;
    --err: #c4302b;
    --err-bg: #f9d9d6;
    --ref: #7b48c4;
    --ref-bg: #ebe1f8;
    --chip-ink: #ffffff;

    --yes: #2e7d32;
    --yes-bg: #d8eed4;
    --no: #c4302b;
    --no-bg: #f9d9d6;
    --tok: #f2a900;
    --tok-ring: #6b4a00;

    --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace;
    --sans: "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --paper: #17181d; --panel: #202229; --ink: #ecebe6; --muted: #9a988f; --line: #363945; --inline-code: #2d3039;
        --code-bg: #111318; --code-active: #2c3345;
        --var-bg: #2c4a2a; --var-border: #71b066; --var-ink: #d8f3cf;
        --free-bg: #262830; --free-border: #3d404c;
        --read: #6ea2ff; --read-bg: #1f3354; --write: #ffa24d; --write-bg: #4a2e12;
        --err: #ff6b63; --err-bg: #4a1c1a; --ref: #b38cff; --ref-bg: #33284a;
        --chip-ink: #111111;
        --yes: #7fd18a; --yes-bg: #1f3a22; --no: #ff6b63; --no-bg: #4a1c1a;
        --tok: #ffd166; --tok-ring: #111111;
    }
}
:root[data-theme="dark"] {
    --paper: #17181d; --panel: #202229; --ink: #ecebe6; --muted: #9a988f; --line: #363945; --inline-code: #2d3039;
    --code-bg: #111318; --code-active: #2c3345;
    --var-bg: #2c4a2a; --var-border: #71b066; --var-ink: #d8f3cf;
    --free-bg: #262830; --free-border: #3d404c;
    --read: #6ea2ff; --read-bg: #1f3354; --write: #ffa24d; --write-bg: #4a2e12;
    --err: #ff6b63; --err-bg: #4a1c1a; --ref: #b38cff; --ref-bg: #33284a;
    --chip-ink: #111111;
    --yes: #7fd18a; --yes-bg: #1f3a22; --no: #ff6b63; --no-bg: #4a1c1a;
    --tok: #ffd166; --tok-ring: #111111;
}

* { box-sizing: border-box; }
html { font-size: clamp(11px, min(1.15vw, 2.05vh), 22px); }
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
}
.app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: .7rem;
    height: 100vh;
    padding: .8rem 1rem;
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 1.2rem; }
.top h1 { margin: 0; font-size: 1.35rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
.top h1 small { display: block; font-size: .7rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: .35rem; flex: 1; }
.tab {
    font: inherit; font-size: .82rem;
    padding: .38rem .8rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--ink);
    cursor: pointer;
}
.tab:hover { border-color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .adv { font-size: .65rem; font-weight: 700; color: var(--ref); margin-left: .3rem; }
.tab[aria-selected="true"] .adv { color: inherit; opacity: .75; }

/* ---------- main stage ---------- */
.stage {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 35fr) minmax(0, 39fr) minmax(0, 26fr);
    gap: 1rem;
    min-height: 0;
}
.col { display: flex; flex-direction: column; gap: .7rem; min-height: 0; }
.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .6rem;
    padding: .6rem .8rem;
    min-height: 0;
}
.panel-title {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    margin-bottom: .45rem;
    font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
}
.panel-title .note { text-transform: none; letter-spacing: 0; font-weight: 500; }

/* code */
.code-panel { flex: none; overflow: hidden; background: var(--code-bg); border-color: var(--line); }
.code-panel .panel-title { color: var(--code-num); }
.code-wrap { position: relative; }
.code { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: .98rem; }
.code li {
    display: flex; gap: .8rem;
    padding: .2rem .5rem .2rem 1.35rem;
    border-left: 3px solid transparent; border-radius: .25rem;
    color: var(--code-ink);
    white-space: pre;
    transition: background .25s;
}
.code .ln { flex: none; width: 1.2rem; text-align: right; color: var(--code-num); }
.code li.active { background: var(--code-active); border-left-color: var(--code-marker); }
.code li.edited { animation: edited 1.6s both; }
.code .k { color: #c792ea; }
.code .s { color: #a5d986; }
.code .n { color: #f7b267; }
.code .c { color: #7a8299; font-style: italic; }
.code .o { color: #82aaff; }
.code .part {
    border-radius: .2rem;
    outline: 2px solid var(--code-marker); outline-offset: 1px;
    background: rgba(255, 209, 102, .16);
}
.ctok {
    position: absolute; left: .3rem; top: 0;
    width: .72rem; height: .72rem; border-radius: 50%;
    background: var(--tok);
    box-shadow: 0 0 0 .18rem rgba(255, 209, 102, .28), 0 0 .7rem .15rem var(--tok);
    transition: transform .45s cubic-bezier(.45, .05, .35, 1), opacity .25s;
    pointer-events: none;
}

/* console */
.console-panel { flex: 1; display: flex; flex-direction: column; min-height: 5rem; }
.console { flex: 1; overflow: auto; font-family: var(--mono); font-size: .98rem; }
.cline { padding: .15rem .4rem; border-bottom: 1px solid var(--line); white-space: pre; }
.cline .prompt { color: var(--muted); margin-right: .5rem; }
.cline.err { color: var(--err); background: var(--err-bg); }
.cline.fresh { animation: fadein .35s both; }

/* flowchart */
.flow-panel { display: flex; flex-direction: column; }
.flow-box { position: relative; flex: 1; min-height: 0; }
#flow { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fn .sh { stroke-width: 2; transition: stroke .25s, stroke-width .25s, filter .25s; }
.fn text { font-family: var(--mono); font-size: 16px; fill: var(--ink); }
.fn.k-box .sh { fill: var(--write-bg); stroke: var(--write); }
.fn.k-dia .sh { fill: var(--read-bg); stroke: var(--read); }
.fn.k-act .sh { fill: var(--panel); stroke: var(--muted); }
.fn.k-jump .sh { fill: var(--ref-bg); stroke: var(--ref); }
.fn.k-end .sh { fill: var(--free-bg); stroke: var(--muted); stroke-dasharray: 4 3; }
.fn.k-end text { font-family: var(--sans); font-size: 14px; fill: var(--muted); }
.fn { transition: opacity .3s; }
.fn.active .sh { stroke: var(--tok); stroke-width: 4; filter: drop-shadow(0 0 5px var(--tok)); }
.fn.off { opacity: .45; }
.fn.off .sh { stroke-dasharray: 6 4; }
.fn.off text { text-decoration: line-through; }
.fn.dim { opacity: .38; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#ah); transition: stroke .25s; }
.edge.walk { stroke: var(--tok); stroke-width: 3.2; marker-end: url(#ahw); }
#ah path { fill: var(--muted); }
#ahw path { fill: var(--tok); }
.elab { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--muted); }
.elab.yes { fill: var(--yes); }
.elab.no { fill: var(--no); }
.elab.warn { fill: var(--err); }
.region { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .7; }
.rlab { font-family: var(--sans); font-size: 13px; font-style: italic; fill: var(--muted); }
.chk rect { stroke-width: 1.5; }
.chk.yes rect { fill: var(--yes-bg); stroke: var(--yes); }
.chk.no rect { fill: var(--no-bg); stroke: var(--no); }
.chk text { font-family: var(--mono); font-size: 13px; fill: var(--ink); }
.chk text b, .chk .rv { font-weight: 700; }
.chk.yes .rv { fill: var(--yes); }
.chk.no .rv { fill: var(--no); }
.chk.old { opacity: .55; }
.chk.pop { animation: pop .4s both; transform-box: fill-box; transform-origin: center; }
.chk.await { visibility: hidden; }
#tok { transition: opacity .2s; pointer-events: none; }
.tok-halo { fill: var(--tok); opacity: .35; animation: halo 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.tok-core { fill: var(--tok); stroke: var(--tok-ring); stroke-width: 2.5; }
.warn-pill {
    display: none;
    padding: .12rem .6rem; border-radius: 999px;
    background: var(--err); color: #fff;
    text-transform: none; letter-spacing: 0; font-size: .75rem;
}
.warn-pill.on { display: inline-block; animation: blink .8s ease-in-out infinite alternate; }

/* legend */
.legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem 1rem;
    margin-top: .4rem;
    font-size: .7rem; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.sw { width: .95rem; height: .75rem; border: 2px solid; border-radius: .2rem; }
.sw.dia { width: .7rem; height: .7rem; transform: rotate(45deg); border-radius: .1rem; background: var(--read-bg); border-color: var(--read); }
.sw.box { background: var(--write-bg); border-color: var(--write); }
.sw.act { background: var(--panel); border-color: var(--muted); }
.sw.jump { background: var(--ref-bg); border-color: var(--ref); border-radius: .4rem; }
.sw.tokd { width: .75rem; height: .75rem; border-radius: 50%; background: var(--tok); border-color: var(--tok-ring); }

/* variables */
.vars-panel { flex: 1; overflow: hidden; }
.vrow {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    align-items: center; gap: .6rem;
    margin-bottom: .5rem;
}
.vname { display: flex; align-items: center; justify-content: flex-end; gap: .4rem; }
.name { font-family: var(--mono); font-size: 1.15rem; font-weight: 700; }
.kw {
    padding: 0 .3rem; border: 1px solid var(--line); border-radius: .25rem;
    background: var(--panel);
    font-family: var(--mono); font-size: .62rem; color: var(--muted);
}
.vcell {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    height: 2.55rem;
    padding-top: .55rem;
    border: 2px solid var(--var-border); border-radius: .55rem;
    background: var(--var-bg); color: var(--var-ink);
    font-family: var(--mono); font-size: 1.15rem; font-weight: 700;
    overflow: hidden;
    transition: box-shadow .25s;
}
.type {
    position: absolute; top: .1rem; right: .4rem;
    font-family: var(--sans); font-size: .58rem; font-weight: 600; letter-spacing: .03em;
    opacity: .75;
}
.val.t-undefined { font-style: italic; font-weight: 500; opacity: .85; }
.vcell.hl-read  { box-shadow: 0 0 0 3px var(--read), 0 0 0 7px var(--read-bg); }
.vcell.hl-write { box-shadow: 0 0 0 3px var(--write), 0 0 0 7px var(--write-bg); }
.ghost {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-top: .55rem;
    color: var(--muted); text-decoration: line-through;
    animation: ghost .9s ease-in both;
    pointer-events: none;
}
.vcell.changed .val { animation: pop .45s .2s both; }
.vrow.appear { animation: appear .5s both; }
.vrow.leaving { animation: leave 1.1s .5s both; overflow: hidden; }
.vcell.gone { background: var(--free-bg); border-color: var(--free-border); border-style: dashed; color: var(--muted); }
.vcell.gone .val { text-decoration: line-through; }
.empty { font-size: .8rem; color: var(--muted); font-style: italic; }

/* counters */
.counters-panel { flex: none; }
.counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.2rem, 1fr)); gap: .5rem; }
.stat { padding: .35rem .6rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--paper); }
.stat b { display: block; font-family: var(--mono); font-size: 1.6rem; line-height: 1.15; }
.stat span { display: block; font-size: .7rem; color: var(--muted); line-height: 1.25; }

/* ---------- footer ---------- */
.bottom {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.4rem; align-items: center;
    padding: .7rem 1rem;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: .7rem;
}
.explain-meta { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .2rem; }
.explain-text { min-height: calc(1.12rem * 1.45 * 3); font-size: 1.12rem; line-height: 1.45; }
.explain-text code, .explain-text kbd {
    padding: .05rem .3rem; border-radius: .25rem;
    background: var(--inline-code);
    font-family: var(--mono); font-size: .92em;
    white-space: nowrap;
}
.explain-text .r { color: var(--read); font-weight: 700; }
.explain-text .w { color: var(--write); font-weight: 700; }
.explain-text .y { color: var(--yes); font-weight: 700; }
.explain-text .x { color: var(--no); font-weight: 700; }
.explain-text.fresh { animation: fadein .35s both; }
.controls { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
.btns { display: flex; gap: .4rem; }
.btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .5rem .8rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--paper); color: var(--ink);
    font: inherit; font-size: .9rem;
    cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); padding-inline: 1.2rem; }
.btn:disabled { opacity: .35; cursor: default; }
.btn svg { width: 1rem; height: 1rem; fill: currentColor; }
.icon-btn { padding: .45rem; }
.progress { display: flex; gap: 3px; width: 24rem; }
.progress button { flex: 1; height: .5rem; padding: 0; border: 0; border-radius: 2px; background: var(--line); cursor: pointer; }
.progress button.done { background: var(--muted); }
.progress button.cur { background: var(--write); }
.hint { font-size: .66rem; color: var(--muted); }

/* flying values */
.fly {
    position: fixed; z-index: 50;
    padding: .15rem .55rem; border-radius: .45rem;
    background: var(--read); color: var(--chip-ink);
    font-family: var(--mono); font-size: 1.1rem; font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 .3rem .9rem rgba(0, 0, 0, .25);
    pointer-events: none;
}
.fly.write { background: var(--write); }
.await { visibility: hidden; }
.land { animation: land .45s both; }

#selftest {
    position: fixed; inset: 1rem; z-index: 100; overflow: auto;
    padding: 1rem; border: 2px solid var(--ink); border-radius: .6rem;
    background: var(--panel); color: var(--ink);
    font-family: var(--mono); font-size: .9rem; white-space: pre-wrap;
}

@keyframes appear { from { opacity: 0; transform: translateX(-.6rem); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes land { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes ghost { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(70%) scale(.8); } }
@keyframes leave { 0% { opacity: 1; max-height: 3rem; } 60% { opacity: 0; max-height: 3rem; margin-bottom: .5rem; } 100% { opacity: 0; max-height: 0; margin-bottom: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(.3rem); } to { opacity: 1; transform: none; } }
@keyframes halo { 0%, 100% { transform: scale(.8); opacity: .45; } 50% { transform: scale(1.25); opacity: .15; } }
@keyframes blink { from { opacity: 1; } to { opacity: .55; } }
@keyframes edited { 0%, 60% { background: rgba(255, 162, 77, .35); } 100% { background: transparent; } }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* narrow screens: stack everything and let the page scroll */
@media (max-width: 900px) {
    html { font-size: 14px; }
    body { height: auto; overflow: auto; }
    .app { height: auto; }
    .top { flex-wrap: wrap; }
    .stage { grid-template-columns: 1fr; }
    .flow-box { height: 32rem; flex: none; }
    .console-panel { min-height: 9rem; }
    .bottom { grid-template-columns: 1fr; }
    .controls { align-items: stretch; }
    .progress { width: 100%; }
}
</style>
<style>
/* language switch (EN / BG) */
.lang-btn { text-decoration: none; font-weight: 700; font-size: .8rem; letter-spacing: .04em; }
.lang-btn:hover, .lang-btn:focus-visible { border-color: var(--read, currentColor); }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <h1>Loops step by step <small>the path of execution through conditions and loops</small></h1>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <a class="btn lang-btn" id="langBtn" href="bg/loopsStepByStep.html" hreflang="bg" lang="bg" title="Bulgarian version" aria-label="Bulgarian version">BG</a>
        <button class="btn icon-btn" id="themeBtn" title="Light / dark theme" aria-label="Light / dark theme">
            <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5v11a5.5 5.5 0 0 1 0-11z"/></svg>
        </button>
    </header>

    <main class="stage" id="stage">
        <section class="col">
            <div class="panel code-panel">
                <div class="panel-title"><span>Code</span><span class="note" id="lineNote"></span></div>
                <div class="code-wrap"><ol class="code" id="code"></ol><div class="ctok" id="ctok"></div></div>
            </div>
            <div class="panel console-panel">
                <div class="panel-title"><span>Console</span></div>
                <div class="console" id="console"></div>
            </div>
        </section>
        <section class="panel flow-panel">
            <div class="panel-title"><span>Flowchart</span><span class="warn-pill" id="warn"></span></div>
            <div class="flow-box"><svg id="flow" aria-label="Flowchart of the code"></svg></div>
            <div class="legend">
                <span><i class="sw dia"></i>condition (reads)</span>
                <span><i class="sw box"></i>assignment (writes)</span>
                <span><i class="sw act"></i>action</span>
                <span><i class="sw jump"></i>jump</span>
                <span><i class="sw tokd"></i>current place</span>
            </div>
        </section>
        <section class="col">
            <div class="panel vars-panel">
                <div class="panel-title"><span>Variables</span><span class="note">the values right now</span></div>
                <div id="vars"></div>
            </div>
            <div class="panel counters-panel" id="countersPanel">
                <div class="panel-title"><span>Counters</span></div>
                <div class="counters" id="counters"></div>
            </div>
        </section>
    </main>

    <footer class="bottom">
        <div>
            <div class="explain-meta" id="explainMeta"></div>
            <div class="explain-text" id="explain" aria-live="polite"></div>
        </div>
        <div class="controls">
            <div class="btns">
                <button class="btn icon-btn" id="firstBtn" title="To the start (Home)" aria-label="To the start">
                    <svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM13 3L6 8l7 5z"/></svg>
                </button>
                <button class="btn" id="prevBtn" title="Back (Left arrow)">
                    <svg viewBox="0 0 16 16"><path d="M11 3L4 8l7 5z"/></svg>Back
                </button>
                <button class="btn" id="playBtn" title="Auto-play (P)"></button>
                <button class="btn primary" id="nextBtn" title="Next (Right arrow or Space)">
                    Next<svg viewBox="0 0 16 16"><path d="M5 3l7 5-7 5z"/></svg>
                </button>
            </div>
            <div class="progress" id="progress"></div>
            <div class="hint">Keys: Left / Right arrows, Space, Home, P, 1-7</div>
        </div>
    </footer>
</div>
<div id="flyLayer"></div>

<script>
// ===========================================================================
// BEGIN PURE - scenario data and state replay (no DOM; also loaded by a Node test)
// ===========================================================================
function freshState() {
    return {
        node: null, line: -1, part: null, tok: null,
        vars: {}, order: [], console: [], checks: {}, cnt: {}, hl: {},
        code: null, edited: [], off: [], dim: [], walk: [], warn: null, stepNo: 0,
    };
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function typeOf(lit) {
    if (lit === 'undefined') return 'undefined';
    if (lit === 'true' || lit === 'false') return 'boolean';
    if (lit.startsWith('"')) return 'string';
    return 'number';
}

// Helpers used by the steps. Each one mutates the state `s`.
function decl(s, name, lit, kind = 'let') {
    if (!s.vars[name]) s.order.push(name);
    s.vars[name] = { v: lit, kind };
    s.hl[name] = 'write';
}
function set(s, name, lit) { s.vars[name].v = lit; s.hl[name] = 'write'; }
function drop(s, ...names) {
    for (const n of names) { delete s.vars[n]; delete s.hl[n]; s.order = s.order.filter(x => x !== n); }
}
function log(s, text, err = false) { s.console.push({ text, err }); }
function chk(s, node, expr, val) { s.checks[node] = { expr, val, step: s.stepNo }; }
function cnt(s, key, d = 1) { s.cnt[key] = (s.cnt[key] || 0) + d; }
function restart(s, code, edited) {
    const stepNo = s.stepNo;
    Object.assign(s, freshState(), { code, edited, stepNo });
}

// Flowchart builder. Nodes: k = box (assignment), dia (condition), act (action),
// jump (break / continue), end (terminal). Edges: [from, to, points, label, labelPos, anchor, cls]
function flow(w, h, nodes, edgeFn, regions = []) {
    const N = {};
    nodes.forEach(n => N[n.id] = n);
    const P = (id, side) => {
        const n = N[id];
        if (side === 't') return [n.x, n.y - n.h / 2];
        if (side === 'b') return [n.x, n.y + n.h / 2];
        if (side === 'l') return [n.x - n.w / 2, n.y];
        return [n.x + n.w / 2, n.y];
    };
    const E = {};
    edgeFn((f, t, p, lab, lp, anchor, cls) => { E[f + '>' + t] = { f, t, p, lab, lp, anchor: anchor || 'start', cls }; }, P);
    return { w, h, nodes: N, edges: E, regions };
}

//   step.do     - changes applied before the hops (e.g. restart with edited code)
//   step.check  - the console at this step must equal the real output of the code (tested in Node)
//   step.spin   - endless loop: the token keeps circling along spin.path

    '} else if (age < 18 && age > 12) {',

    '} else {',
    '    status = "child";',
    '}',

];

const WHILE_CODE = [
    'let userTries = 5;',
    'while (userTries > 0) {',
    '    console.log(`Try: ${userTries}`);',
    '    userTries--; // important line!',
    '}',
    'console.log("End");',
];
const WHILE_BUG = WHILE_CODE.map((l, i) => i === 3 ? '    // userTries--;  (forgotten!)' : l);

const lapFor = i => [
    { n: 'cond', r: ['i'], do: s => { chk(s, 'cond', `${i} < 5`, true); cnt(s, 'checks'); } },
    { n: 'body', r: ['i'], do: s => { log(s, 'i=' + i); cnt(s, 'iters'); } },
    { n: 'inc', do: s => { set(s, 'i', String(i + 1)); cnt(s, 'incs'); } },
];
const lapWhile = t => [
    { n: 'cond', r: ['userTries'], do: s => { chk(s, 'cond', `${t} > 0`, true); cnt(s, 'checks'); } },
    { n: 'log', r: ['userTries'], do: s => { log(s, 'Try: ' + t); cnt(s, 'iters'); } },
    { n: 'dec', do: s => set(s, 'userTries', String(t - 1)) },
];

// break / continue
const bc = {
    cond: i => ({ n: 'cond', r: ['i'], do: s => { chk(s, 'cond', `${i} <= 20`, true); cnt(s, 'iters'); } }),
    d1: i => ({ n: 'd1', r: ['i'], do: s => chk(s, 'd1', `${i} % 2 !== 0`, i % 2 !== 0) }),
    log: i => ({ n: 'log', r: ['i'], do: s => log(s, String(i)) }),
    d2: i => ({ n: 'd2', r: ['i'], do: s => chk(s, 'd2', `${i} % 7 === 0`, i % 7 === 0) }),
    inc: i => ({ n: 'inc', do: s => set(s, 'i', String(i + 1)) }),
    cont: () => ({ n: 'cont', do: s => cnt(s, 'cont') }),
};

// nested loops
const nl = {
    oc: (i, ok) => ({ n: 'oc', r: ['i', 'treeDeep'], do: s => { chk(s, 'oc', `${i} <= 3`, ok); if (ok) cnt(s, 'outer'); } }),
    row: () => ({ n: 'row', do: s => decl(s, 'row', '""') }),
    ii: () => ({ n: 'ii', do: s => decl(s, 'j', '1') }),
    ic: (j, i) => ({ n: 'ic', r: ['j', 'i'], do: s => chk(s, 'ic', `${j} <= ${i}`, j <= i) }),
    ib: r => ({ n: 'ib', r: ['row'], do: s => { set(s, 'row', `"${r}"`); cnt(s, 'inner'); } }),
    iinc: j => ({ n: 'iinc', do: s => set(s, 'j', String(j + 1)) }),
    log: r => ({ n: 'log', r: ['row'], do: s => { drop(s, 'j'); log(s, r); } }),
    oinc: i => ({ n: 'oinc', do: s => { drop(s, 'row'); set(s, 'i', String(i + 1)); } }),
};

// State replay: states[i] is the state after step i, frames[i] the state after each hop
// of step i, bases[i] the state before the first hop of step i.
function computeStates(sc) {
    const fl = sc.flow;
    let s = freshState();
    const states = [], frames = [], bases = [];
    sc.steps.forEach((step, idx) => {
        s = clone(s);
        s.hl = {}; s.edited = []; s.stepNo = idx;
        const hops = step.hops || [];
        if (hops.length) s.walk = [];
        if (step.do) step.do(s);
        bases.push(clone(s));
        const fr = [];
        for (const hop of hops) {
            s.hl = {};
            const from = s.node;
            if (hop.n) {
                const n = fl.nodes[hop.n];
                if (!n) throw new Error(`${sc.tab}: step ${idx + 1}: no node "${hop.n}"`);
                const key = from + '>' + hop.n;
                if (from === hop.n) { /* stays */ }
                else if (from && fl.edges[key]) { s.walk.push(key); s.tok = fl.edges[key].p.at(-1); }
                else s.tok = [n.x, n.y - n.h / 2];
                s.node = hop.n;
                s.line = hop.line !== undefined ? hop.line : (n.line !== undefined ? n.line : -1);
                s.part = n.part || null;
            } else {
                s.node = null; s.tok = null;
                s.line = hop.line !== undefined ? hop.line : -1;
                s.part = hop.part || null;
            }
            (hop.r || []).forEach(v => { if (s.vars[v]) s.hl[v] = 'read'; });
            if (hop.do) hop.do(s);
            fr.push(clone(s));
        }
        frames.push(fr);
        states.push(clone(s));
    });
    return { states, frames, bases };
}

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

const TOKENS = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`[^`]*`)|\b(let|const|var|if|else|for|while|do|switch|case|break|continue|default|typeof|null|undefined|true|false)\b|(\b\d+(?:\.\d+)?\b)|\b(console)\b/g;
function highlight(line) {
    let out = '', last = 0;
    line.replace(TOKENS, (m, c, str, k, n, o, idx) => {
        out += esc(line.slice(last, idx));
        const cls = c ? 'c' : str ? 's' : k ? 'k' : n ? 'n' : 'o';
        out += `<span class="${cls}">${esc(m)}</span>`;
        last = idx + m.length;
        return m;
    });
    return out + esc(line.slice(last));
}

function renderState(s, prev, fx, flights, hop, moveMs) {
    renderCode(s, fx ? moveMs : 0);
    renderVars(s, prev, fx);
    const newLines = renderConsole(s, prev, fx);
    renderCounters(s, prev, fx);
    const freshChecks = renderFlow(s, prev, fx);
    setTok(s.tok);
    if (!fx || !flights || !hop || reduceMotion || !prev) return 0;

    const tk = token;
    const src = nodeEl(hop.n);
    let end = 0;
    const reads = (hop.r || []).filter(v => prev.vars[v] && s.vars[v]);
    reads.forEach((v, i) => { end = Math.max(end, fly(varCell(v), src, prev.vars[v].v, 'read', i * STAGGER, tk)); });

    const start = reads.length ? end * .8 : 0;

// ---------------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------------
function render(animate) {
    const step = sc().steps[stepIdx];
    const s = data.states[stepIdx];
    const tk = ++token;
    $('#flyLayer').innerHTML = '';
    const frames = data.frames[stepIdx];
    let est = 0;
    if (animate && stepIdx > 0 && frames.length && !reduceMotion) {
        est = frames.length * (frames.length > 1 ? 750 : 2100);
        playHops(tk, step, data.bases[stepIdx], frames);
    } else {
        renderState(s, null, false);
        if (step.spin) requestAnimationFrame(() => spin(step, s, tk));
    }

    const N = sc().steps.length;
    $('#explainMeta').textContent = `Step ${stepIdx + 1} of ${N}`;
    const ex = $('#explain');
    ex.innerHTML = step.text;
    ex.classList.remove('fresh'); void ex.offsetWidth; ex.classList.add('fresh');

    $('#progress').innerHTML = sc().steps.map((_, i) =>
        `<button class="${i < stepIdx ? 'done' : i === stepIdx ? 'cur' : ''}" data-i="${i}" title="Step ${i + 1}" aria-label="Step ${i + 1}"></button>`).join('');
    $('#firstBtn').disabled = $('#prevBtn').disabled = stepIdx === 0;
    $('#nextBtn').disabled = stepIdx === N - 1;
    $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    try { history.replaceState(null, '', location.pathname + location.search + `#${scIdx + 1}.${stepIdx + 1}`); } catch (e) { /* file:// in some browsers */ }

}

}

    data = computeStates(sc());
    document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', j === scIdx));
    buildFlow();

// ---------------------------------------------------------------------------
// Self-test (#selftest): replays every step of every scenario
// ---------------------------------------------------------------------------
function selfTest() {
    const errors = [];
    const okText = /^[\x20-\x7E\n]*$/;
    SCENARIOS.forEach((s, si) => {
        const name = `${si + 1}. ${s.tab}`;
        let d;
        try { d = computeStates(s); } catch (e) { errors.push(`${name}: ${e.message}`); return; }
        let prevNode = null;
        s.steps.forEach((step, k) => {
            const where = `${name}, step ${k + 1}`;
            if (!okText.test(step.text)) errors.push(`${where}: non-ASCII punctuation in text`);
            if (step.text.replace(/<[^>]+>/g, '').length > 340) errors.push(`${where}: text is long (${step.text.replace(/<[^>]+>/g, '').length})`);
            if (d.bases[k].node === null) prevNode = null;
            (step.hops || []).forEach((h, j) => {
                if (h.n && prevNode && prevNode !== h.n && !s.flow.edges[prevNode + '>' + h.n]) errors.push(`${where}: no edge ${prevNode}>${h.n}`);
                prevNode = h.n;
            });
            for (const f of d.frames[k]) {
                const code = f.code || s.code;
                const act = Array.isArray(f.line) ? f.line : [f.line];
                act.forEach(l => { if (l >= code.length) errors.push(`${where}: line ${l} out of range`); });
                if (f.part && !code[act[0]].includes(f.part)) errors.push(`${where}: part "${f.part}" not in line ${act[0] + 1}`);
            }
        });
        for (const n of Object.values(s.flow.nodes)) {
            const lens = n.t.split('\n').map(l => l.length * 9.6 + 14);
            const room = n.k === 'dia' ? n.w * (1 - (n.t.split('\n').length * 20) / n.h) : n.w;
            if (Math.max(...lens) > room) errors.push(`${name}: node ${n.id} text too wide (${Math.max(...lens) | 0} > ${room | 0})`);
        }
        try {
            scIdx = si; data = d; buildFlow();
            for (let k = 0; k < s.steps.length; k++) { stepIdx = k; renderState(d.states[k], null, false); }
        } catch (e) { errors.push(`${name}: render: ${e.message}`); }
    });
    const out = errors.length ? 'SELFTEST FAILED\n' + errors.join('\n') : `SELFTEST OK (${SCENARIOS.length} scenarios, ${SCENARIOS.reduce((a, s) => a + s.steps.length, 0)} steps)`;
    const pre = document.createElement('pre');
    pre.id = 'selftest';
    pre.textContent = out;
    document.body.appendChild(pre);
    document.title = out.split('\n')[0];
    console.log(out);
}

document.addEventListener('keydown', e => {

});

const THEME_KEY = 'loopsStepByStepTheme';
$('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.dataset.theme
        ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = isDark ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, root.dataset.theme); } catch (e) { /* storage blocked */ }
});
try {
    const q = new URLSearchParams(location.search).get('theme');
    const t = q === 'dark' || q === 'light' ? q : localStorage.getItem(THEME_KEY);
    if (t) document.documentElement.dataset.theme = t;
} catch (e) { /* storage blocked */ }

// the code token is positioned in pixels, so move it when the layout changes
new ResizeObserver(() => {
    if (!data) return;
    const s = data.states[stepIdx];
    const act = Array.isArray(s.line) ? s.line : [s.line];
    placeCodeToken(act[0], 0);
}).observe($('#code'));

function fromHash() {
    const m = /^#(\d+)(?:\.(\d+))?/.exec(location.hash);
    selectScenario(m ? +m[1] - 1 : 0, m && m[2] ? +m[2] - 1 : 0);
}
window.addEventListener('hashchange', fromHash);
if (location.hash === '#selftest') { selfTest(); }
else fromHash();
</script>
<script>
// language switch: keep the current scenario / step (#N.M) and theme
(function () {
    var a = document.getElementById('langBtn');
    if (!a) return;
    var base = a.getAttribute('href');
    a.addEventListener('click', function () {
        var t = document.documentElement.dataset.theme;
        a.href = base + (t === 'light' || t === 'dark' ? '?theme=' + t : '') + location.hash;
    });
})();
</script>
</body>
</html>
