<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обхват на променливите</title>
<!--
    Step-by-step animation: scopes as nested boxes and how JavaScript looks up
    a name along the scope chain.
    Self-contained (no external files), so it works offline and inside an iframe.
    Deep link: scopeChain.html#3 (scenario 3) or scopeChain.html#3.5 (scenario 3, step 5).
    scopeChain.html?theme=dark forces the dark theme; #selftest walks every step.
-->
<style>
:root {
    --paper: #f3eee3;
    --panel: #fffcf5;
    --ink: #26221c;
    --muted: #786f61;
    --line: #ddd3c1;
    --inline-code: #ece5d6;

    --code-bg: #22252f;
    --code-ink: #e9e6dd;
    --code-num: #6c7285;
    --code-active: #363d52;
    --code-marker: #ffd166;

    --var-bg: #c4e3b8;
    --var-border: #4f8a45;
    --var-ink: #18330f;

    --read: #2563c9;
    --read-bg: #dbe7fb;
    --write: #d66d08;
    --write-bg: #fde5c8;
    --err: #c4302b;
    --err-bg: #f9d9d6;
    --ref: #7b48c4;
    --chip-ink: #ffffff;

    /* scope boxes */
    --g-bg: #f1ebdd;
    --g-border: #b9aa8a;
    --f-bg: #dcefec;
    --f-border: #4f978e;
    --b-bg: #fff1c9;
    --b-border: #c99a2e;
    --here: #e2a400;
    --here-ink: #26221c;
    --link: #8f8676;

    --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace;
    --sans: "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --paper: #17181d; --panel: #202229; --ink: #ecebe6; --muted: #9a988f; --line: #363945; --inline-code: #2d3039;
        --code-bg: #111318; --code-active: #2c3345;
        --var-bg: #2c4a2a; --var-border: #71b066; --var-ink: #d8f3cf;
        --read: #6ea2ff; --read-bg: #1f3354; --write: #ffa24d; --write-bg: #4a2e12;
        --err: #ff6b63; --err-bg: #4a1c1a; --ref: #b38cff;
        --chip-ink: #111111;
        --g-bg: #272930; --g-border: #555a68; --f-bg: #1b3431; --f-border: #4fa197;
        --b-bg: #3a3220; --b-border: #c9a24a; --here: #ffd166; --here-ink: #17181d; --link: #8d8b84;
    }
}
:root[data-theme="dark"] {
    --paper: #17181d; --panel: #202229; --ink: #ecebe6; --muted: #9a988f; --line: #363945; --inline-code: #2d3039;
    --code-bg: #111318; --code-active: #2c3345;
    --var-bg: #2c4a2a; --var-border: #71b066; --var-ink: #d8f3cf;
    --read: #6ea2ff; --read-bg: #1f3354; --write: #ffa24d; --write-bg: #4a2e12;
    --err: #ff6b63; --err-bg: #4a1c1a; --ref: #b38cff;
    --chip-ink: #111111;
    --g-bg: #272930; --g-border: #555a68; --f-bg: #1b3431; --f-border: #4fa197;
    --b-bg: #3a3220; --b-border: #c9a24a; --here: #ffd166; --here-ink: #17181d; --link: #8d8b84;
}

* { box-sizing: border-box; }
html { font-size: clamp(11px, min(1.15vw, 2.05vh), 22px); }
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
}
.app {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: .7rem;
    height: 100vh;
    padding: .8rem 1rem;
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 1.2rem; }
.top h1 { margin: 0; font-size: 1.35rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
.top h1 small { display: block; font-size: .7rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: .35rem; flex: 1; }
.tab {
    font: inherit; font-size: .82rem;
    padding: .38rem .8rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--ink);
    cursor: pointer;
}
.tab:hover { border-color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .adv { font-size: .65rem; font-weight: 700; color: var(--ref); margin-left: .3rem; }
.tab[aria-selected="true"] .adv { color: inherit; opacity: .75; }

/* ---------- main stage ---------- */
.stage {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 37fr) minmax(0, 63fr);
    gap: 1rem;
    min-height: 0;
}
.left { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: .7rem; min-height: 0; }
.right { display: flex; flex-direction: column; gap: .6rem; min-height: 0; }
.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .6rem;
    padding: .6rem .8rem;
    min-height: 0;
}
.panel-title {
    display: flex; justify-content: space-between; gap: 1rem;
    margin-bottom: .45rem;
    font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
}
.panel-title .note { text-transform: none; letter-spacing: 0; font-weight: 500; }

/* code */
.code-panel { background: var(--code-bg); border-color: var(--line); }
.code-panel .panel-title { color: var(--code-num); }
.code { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 1rem; }
.code li {
    display: flex; gap: .8rem;
    padding: .17rem .5rem;
    border-left: 3px solid transparent; border-radius: .25rem;
    color: var(--code-ink);
    white-space: pre;
    transition: background .25s;
}
.code .ln { flex: none; width: 1.3rem; text-align: right; color: var(--code-num); }
.code li.active { background: var(--code-active); border-left-color: var(--code-marker); }
.code li.active.error:not(.await-err) { background: #4d2329; border-left-color: #ff6b63; }
.code .k { color: #c792ea; }
.code .s { color: #a5d986; }
.code .n { color: #f7b267; }
.code .c { color: #7a8299; font-style: italic; }
.code .o { color: #82aaff; }

/* console */
.console-panel { display: flex; flex-direction: column; }
#selftest { position: fixed; left: 0; bottom: 0; z-index: 99; max-height: 50vh; overflow: auto; margin: 0; padding: .5rem; background: #000; color: #0f0; font-size: 12px; }
.console { flex: 1; overflow: auto; font-family: var(--mono); font-size: .98rem; }
.cline { padding: .15rem .4rem; border-bottom: 1px solid var(--line); white-space: pre-wrap; }
.cline .prompt { color: var(--muted); margin-right: .5rem; }
.cline.err { color: var(--err); background: var(--err-bg); }

/* ---------- scope tree ---------- */
.tree-panel { flex: 1; display: flex; flex-direction: column; }
.tree-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.tree { position: relative; z-index: 1; }
.links { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; pointer-events: none; }
.link { fill: none; stroke: var(--link); stroke-width: 2; stroke-linejoin: round; }
.link.p-read { stroke: var(--read); stroke-width: 3; }
.link.p-write { stroke: var(--write); stroke-width: 3; }
.link.p-err { stroke: var(--err); stroke-width: 3; }
.link.fresh { animation: fadein-plain .6s both; }

.scope {
    position: relative;
    padding: .4rem .7rem .55rem 1.9rem;
    border: 2px solid var(--sc-border); border-radius: .7rem;
    background: var(--sc-bg);
    transition: box-shadow .25s, opacity .3s;
}
.scope.k-global { --sc-bg: var(--g-bg); --sc-border: var(--g-border); }
.scope.k-function { --sc-bg: var(--f-bg); --sc-border: var(--f-border); }
.scope.k-block { --sc-bg: var(--b-bg); --sc-border: var(--b-border); }
.scope.cur { box-shadow: 0 0 0 3px var(--here); }
.scope.appear { animation: fadein-plain .6s both; }
.scope.dying { opacity: .5; border-style: dashed; box-shadow: none; }
.sc-head { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem .5rem; min-height: 1.6rem; }
.sc-label { font-family: var(--mono); font-size: 1.08rem; font-weight: 700; }
.sc-kind { font-size: .62rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sc-note { font-size: .72rem; font-style: italic; color: var(--muted); }
.builtins { margin-left: auto; font-size: .68rem; color: var(--muted); }
.builtins code { font-family: var(--mono); }
.here, .dtag {
    padding: .05rem .5rem; border-radius: .3rem;
    font-size: .64rem; font-weight: 700;
}
.here { background: var(--here); color: var(--here-ink); }
.dtag { background: var(--muted); color: var(--panel); }
.miss {
    padding: .02rem .45rem; border-radius: .3rem;
    border: 1.5px dashed currentColor;
    font-family: var(--mono); font-size: .74rem; font-weight: 700;
    background: var(--panel);
}
.miss.m-read { color: var(--read); }
.miss.m-write { color: var(--write); }
.miss.m-err { color: var(--err); border-style: solid; background: var(--err-bg); }
.vars { display: flex; flex-wrap: wrap; gap: .45rem .7rem; margin: .3rem 0 .1rem; }
.vars:empty::before { content: "няма декларирани имена"; font-size: .74rem; font-style: italic; color: var(--muted); }
.kids { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .7rem; margin-top: .8rem; }
.kids:empty { display: none; }

/* variable cards */
.vc { position: relative; display: flex; flex-direction: column; gap: .15rem; min-width: 7.4rem; }
.vc-top { display: flex; align-items: center; gap: .3rem; }
.name { font-family: var(--mono); font-size: 1.08rem; font-weight: 700; }
.kw {
    padding: 0 .3rem; border: 1px solid var(--line); border-radius: .25rem;
    background: var(--panel);
    font-family: var(--mono); font-size: .62rem; color: var(--muted);
}
.kw.k-implicit { color: var(--err); border-color: var(--err); font-family: var(--sans); }
.cell {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    height: 2.55rem;
    padding: .5rem .7rem 0;
    border: 2px solid var(--var-border); border-radius: .5rem;
    background: var(--var-bg); color: var(--var-ink);
    font-family: var(--mono); font-size: 1.12rem; font-weight: 700;
    white-space: nowrap;
    transition: box-shadow .25s;
}
.type {
    position: absolute; top: .05rem; right: .35rem;
    font-family: var(--sans); font-size: .55rem; font-weight: 600; letter-spacing: .03em;
    opacity: .75;
}
.val.t-undefined { font-style: italic; font-weight: 500; opacity: .85; }
.val.t-function { color: var(--ref); font-style: italic; font-size: .92rem; }
.uninit, .old.uninit { font-family: var(--sans); font-size: .7rem; font-style: italic; font-weight: 500; opacity: .7; }
.cell .old { display: none; }
.cell.await .old { display: inline; opacity: .6; }
.cell.await .val, .cell.await .type { display: none; }
.cell.hl-read  { box-shadow: 0 0 0 3px var(--read), 0 0 0 7px var(--read-bg); }
.cell.hl-write { box-shadow: 0 0 0 3px var(--write), 0 0 0 7px var(--write-bg); }
.cell.hl-new   { box-shadow: 0 0 0 3px var(--var-border); }
.cell.hl-dup   { box-shadow: 0 0 0 3px var(--write); outline: 2px dashed var(--write); outline-offset: 5px; }
.cell.await-hl { box-shadow: none; outline: none; }
.vc.shadowed { opacity: .5; }
.vc.shadowed .stag {
    position: absolute; bottom: -.55rem; left: 50%; transform: translateX(-50%);
    padding: 0 .35rem; border-radius: .25rem;
    background: var(--muted); color: var(--panel);
    font-size: .56rem; font-weight: 700; white-space: nowrap;
}
.vc.appear { animation: fadein-plain .5s both; }
.vc.await-card { visibility: hidden; }

/* lookup strip */
.lookup-panel { flex: none; }
.lk { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .45rem; min-height: 2.3rem; }
.lk-empty { font-size: .8rem; font-style: italic; color: var(--muted); }
.lk-q { display: inline-flex; align-items: center; gap: .4rem; margin-right: .4rem; }
.lk-q .name { padding: .05rem .4rem; border-radius: .3rem; background: var(--inline-code); }
.lk-mode { font-size: .72rem; font-weight: 700; }
.lk-mode.m-read { color: var(--read); }
.lk-mode.m-write { color: var(--write); }
.hop {
    display: inline-flex; flex-direction: column; align-items: center;
    padding: .12rem .6rem; border-radius: .45rem;
    border: 1.5px solid var(--line);
    font-family: var(--mono); font-size: .86rem; font-weight: 700; line-height: 1.2;
}
.hop small { font-family: var(--sans); font-size: .66rem; font-weight: 600; color: var(--muted); }
.hop.miss-h { border-style: dashed; color: var(--muted); }
.hop.hit.m-read { border-color: var(--read); background: var(--read-bg); }
.hop.hit.m-write { border-color: var(--write); background: var(--write-bg); }
.hop.hit small { color: inherit; }
.hop.err { border-color: var(--err); background: var(--err-bg); color: var(--err); }
.hop.err small, .hop.new small { color: inherit; }
.hop.new { border-color: var(--err); color: var(--err); border-style: dashed; }
.hop.pending { border-style: dashed; color: var(--muted); }
.lk-sep { width: 1.1rem; height: .8rem; color: var(--muted); }
.hop.await, .lk-sep.await, .miss.await, .cline.await { visibility: hidden; }

/* legend */
.legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem 1rem;
    font-size: .72rem; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.sw { width: .95rem; height: .95rem; border: 2px solid; border-radius: .25rem; }
.sw.g { background: var(--g-bg); border-color: var(--g-border); }
.sw.f { background: var(--f-bg); border-color: var(--f-border); }
.sw.b { background: var(--b-bg); border-color: var(--b-border); }
.sw.here { background: var(--panel); border-color: var(--here); border-width: 3px; }
.sw.read { background: var(--read-bg); border-color: var(--read); }
.sw.write { background: var(--write-bg); border-color: var(--write); }
.sw.link { height: 0; border-width: 2px 0 0; border-radius: 0; border-color: var(--link); width: 1.4rem; }

/* ---------- footer ---------- */
.bottom {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.4rem; align-items: center;
    padding: .7rem 1rem;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: .7rem;
}
.explain-meta { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .2rem; }
.explain-text { min-height: calc(1.08rem * 1.42 * 3); font-size: 1.08rem; line-height: 1.42; }
.explain-text code, .explain-text kbd {
    padding: .05rem .3rem; border-radius: .25rem;
    background: var(--inline-code);
    font-family: var(--mono); font-size: .92em;
}
.explain-text .r { color: var(--read); font-weight: 700; }
.explain-text .w { color: var(--write); font-weight: 700; }
.explain-text .e { color: var(--err); font-weight: 700; }
.explain-text.fresh { animation: fadein .35s both; }
.controls { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
.btns { display: flex; gap: .4rem; }
.btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .5rem .8rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--paper); color: var(--ink);
    font: inherit; font-size: .9rem;
    cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); padding-inline: 1.2rem; }
.btn:disabled { opacity: .35; cursor: default; }
.btn svg { width: 1rem; height: 1rem; fill: currentColor; }
.icon-btn { padding: .45rem; }
.progress { display: flex; gap: 3px; width: 24rem; }
.progress button { flex: 1; height: .5rem; padding: 0; border: 0; border-radius: 2px; background: var(--line); cursor: pointer; }
.progress button.done { background: var(--muted); }
.progress button.cur { background: var(--write); }
.hint { font-size: .66rem; color: var(--muted); }

/* flying values and the search chip */
.fly {
    position: fixed; left: 0; top: 0; z-index: 50;
    display: inline-flex; align-items: center; gap: .3rem;
    padding: .15rem .55rem; border-radius: .45rem;
    background: var(--read); color: var(--chip-ink);
    font-family: var(--mono); font-size: 1.05rem; font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 .3rem .9rem rgba(0, 0, 0, .25);
    pointer-events: none;
}
.fly.write { background: var(--write); }
.fly.rejected { background: var(--err); }
.fly svg { width: .95rem; height: .95rem; }
.land { animation: land .45s both; }

@keyframes fadein-plain { from { opacity: 0; } to { opacity: 1; } }
@keyframes land { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes fadein { from { opacity: 0; transform: translateY(.3rem); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
}

/* 16:9 and narrower (e.g. 1280x720): the code column is relatively narrower, shrink code a bit */
@media (max-aspect-ratio: 2/1) {
    .code { font-size: .84rem; }
}

/* narrow screens: stack everything and let the page scroll */
@media (max-width: 900px) {
    html { font-size: 14px; }
    body { height: auto; overflow: auto; }
    .app { height: auto; }
    .top { flex-wrap: wrap; }
    .stage { grid-template-columns: 1fr; }
    .tree-wrap { overflow: visible; }
    .bottom { grid-template-columns: 1fr; }
    .controls { align-items: stretch; }
    .progress { width: 100%; }
}
</style>
<style>
/* language switch (EN / BG) */
.lang-btn { text-decoration: none; font-weight: 700; font-size: .8rem; letter-spacing: .04em; }
.lang-btn:hover, .lang-btn:focus-visible { border-color: var(--read, currentColor); }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <h1>Обхват на променливите <small>scope и веригата от обхвати (scope chain), стъпка по стъпка</small></h1>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <a class="btn lang-btn" id="langBtn" href="../scopeChain.html" hreflang="en" lang="en" title="English version" aria-label="English version">EN</a>
        <button class="btn icon-btn" id="themeBtn" title="Светла / тъмна тема" aria-label="Светла / тъмна тема">
            <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5v11a5.5 5.5 0 0 1 0-11z"/></svg>
        </button>
    </header>

    <main class="stage" id="stage">
        <section class="left">
            <div class="panel code-panel">
                <div class="panel-title"><span>Код</span><span class="note" id="lineNote"></span></div>
                <ol class="code" id="code"></ol>
            </div>
            <div class="panel console-panel">
                <div class="panel-title"><span>Конзола</span></div>
                <div class="console" id="console"></div>
            </div>
        </section>
        <section class="right">
            <div class="panel tree-panel">
                <div class="panel-title"><span>Обхвати (scopes) - всяка кутия има своя таблица с имена</span><span class="note">стрелката сочи към външния (outer) обхват</span></div>
                <div class="tree-wrap" id="treeWrap">
                    <div class="tree" id="tree"></div>
                    <svg class="links" id="links" aria-hidden="true"></svg>
                </div>
            </div>
            <div class="panel lookup-panel">
                <div class="panel-title"><span>Търсене на име (lookup)</span></div>
                <div class="lk" id="lookup"></div>
            </div>
            <div class="legend" id="legend"></div>
        </section>
    </main>

    <footer class="bottom">
        <div>
            <div class="explain-meta" id="explainMeta"></div>
            <div class="explain-text" id="explain" aria-live="polite"></div>
        </div>
        <div class="controls">
            <div class="btns">
                <button class="btn icon-btn" id="firstBtn" title="Към началото (Home)" aria-label="Към началото">
                    <svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM13 3L6 8l7 5z"/></svg>
                </button>
                <button class="btn" id="prevBtn" title="Назад (стрелка наляво)">
                    <svg viewBox="0 0 16 16"><path d="M11 3L4 8l7 5z"/></svg>Назад
                </button>
                <button class="btn" id="playBtn" title="Автоматично (P)"></button>
                <button class="btn primary" id="nextBtn" title="Напред (стрелка надясно или интервал)">
                    Напред<svg viewBox="0 0 16 16"><path d="M5 3l7 5-7 5z"/></svg>
                </button>
            </div>
            <div class="progress" id="progress"></div>
            <div class="hint">Клавиши: стрелки наляво / надясно, интервал, Home, P, 1-7</div>
        </div>

<script>
// ---------------------------------------------------------------------------
// Scope model
//   s.scopes[id] = { id, parent, kind: global|function|block, label, note, vars: [{ name, kind, value }], dying }
//   value: literal as shown ('5', '"Ada"', 'undefined', 'function') or null = not initialised yet
//   s.look = the name lookup of this step (walks from s.cur outwards)
// ---------------------------------------------------------------------------
const G = 'global';

function scope(s, id, parent, kind, label, note = '') {
    s.scopes[id] = { id, parent, kind, label, note, vars: [], dying: false };
    s.order.push(id);
}
function bind(s, sid, name, kind, value) {
    if (value === undefined) value = kind === 'var' ? 'undefined' : kind === 'function' ? 'function' : null;
    s.scopes[sid].vars.push({ name, kind, value });
    s.hl[sid + '.' + name] = 'new';
}
function enter(s, sid) { s.cur = sid; }
function die(s, sid) { s.scopes[sid].dying = true; }
function drop(s, sid) {
    delete s.scopes[sid];
    s.order = s.order.filter(id => id !== sid);
}
function findVar(s, sid, name) { return s.scopes[sid].vars.find(v => v.name === name); }
function setv(s, sid, name, lit) { findVar(s, sid, name).value = lit; s.hl[sid + '.' + name] = 'write'; }
function log(s, text, err = false) { s.console.push({ text, err }); }
function reset(s, code) { Object.assign(s, { scopes: {}, order: [], cur: null, console: [], code }); }

// Resolve a name like the engine does: current scope, then outer, outer, ... global.
//   opts.write  - literal to assign (otherwise it is a read)
//   opts.strict - assigning to an undeclared name is a ReferenceError
//   opts.max    - stop after this many scopes (to show the search half-way)
function look(s, name, opts = {}) {
    const mode = opts.write !== undefined ? 'write' : 'read';
    const L = { name, mode, hops: [], found: null, error: null, implicit: false, partial: false, value: null, old: null };
    let sid = s.cur, hit = null;
    while (sid) {
        const v = findVar(s, sid, name);
        L.hops.push({ sid, hit: !!v });
        if (v) { hit = v; break; }
        sid = s.scopes[sid].parent;
        if (opts.max && L.hops.length >= opts.max && sid) { L.partial = true; break; }
    }
    s.look = L;
    if (L.partial) return L;
    if (hit) {
        L.found = sid;
        const key = sid + '.' + name;
        // (a write to a not yet initialised let/const here is always its own declaration line)
        if (hit.value === null && mode === 'read') {
            L.error = `Uncaught ReferenceError: Cannot access '${name}' before initialization`;
        } else if (mode === 'write') {
            L.old = hit.value;
            hit.value = opts.write;
            s.hl[key] = 'write';
        } else {
            s.hl[key] = 'read';
        }
        L.value = hit.value;
        // names further out with the same name are shadowed
        for (let p = s.scopes[sid].parent; p; p = s.scopes[p].parent) {
            if (findVar(s, p, name)) s.hl[p + '.' + name] = 'shadowed';
        }
    } else if (mode === 'write' && !opts.strict) {
        // sloppy mode: a new global variable appears
        L.implicit = true;
        L.found = s.order[0];
        L.value = opts.write;
        bind(s, s.order[0], name, 'implicit', opts.write);
        s.hl[s.order[0] + '.' + name] = 'write';
    } else {
        L.error = `Uncaught ReferenceError: ${name} is not defined`;
    }
    if (L.error) { s.err = true; log(s, L.error, true); }
    return L;
}

// Scenarios
//   step.line - active code line (0-based, -1 = none)
//   step.do   - changes to the state

// ---------------------------------------------------------------------------
// State replay: states[i] is the state after step i
// ---------------------------------------------------------------------------
function computeStates(sc) {
    let s = { line: -1, code: null, scopes: {}, order: [], cur: null, look: null, console: [], hl: {}, err: false };
    return sc.steps.map(step => {
        s = JSON.parse(JSON.stringify(s));
        s.hl = {}; s.look = null; s.err = false;
        s.line = step.line;
        if (step.do) step.do(s);
        return s;
    });
}

// Rendering
// ---------------------------------------------------------------------------
const $ = (sel, root = document) => root.querySelector(sel);
const FLY_MS = 760, STAGGER = 200, HOP_MS = 480;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z"/></svg>Пусни';
const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>Пауза';
const ICON_LENS = '<svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ICON_SEP = '<svg class="lk-sep" viewBox="0 0 22 16"><path d="M2 8h15M12 3l6 5-6 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const KIND_TEXT = { global: 'global scope', function: 'local scope', block: 'block scope' };
const KW_TEXT = { implicit: 'без декларация' };

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function typeOf(v) {
    if (v === 'undefined') return 'undefined';
    if (v === 'function') return 'function';
    if (v === 'true' || v === 'false') return 'boolean';
    if (v.startsWith('"')) return 'string';
    return 'number';
}
const plain = v => v.replace(/^"(.*)"$/, '$1');

const TOKENS = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(let|const|var|function|if|for|return|typeof|null|undefined|true|false)\b|(\b\d+(?:\.\d+)?\b)|\b(console)\b/g;
function highlight(line) {
    let out = '', last = 0;
    line.replace(TOKENS, (m, c, str, k, n, o, idx) => {
        out += esc(line.slice(last, idx));
        const cls = c ? 'c' : str ? 's' : k ? 'k' : n ? 'n' : 'o';
        out += `<span class="${cls}">${esc(m)}</span>`;
        last = idx + m.length;
        return m;
    });
    return out + esc(line.slice(last));
}

function renderCode(sc, s, anim) {
    const code = s.code || sc.code;
    $('#code').innerHTML = code.map((l, i) => {
        const cls = [];
        if (i === s.line) cls.push('active');
        if (i === s.line && s.err) cls.push('error', ...(anim ? ['await-err'] : []));
        return `<li class="${cls.join(' ')}"><span class="ln">${i + 1}</span><span>${highlight(l)}</span></li>`;
    }).join('');
    $('#lineNote').textContent = s.line >= 0 ? `изпълнява се ред ${s.line + 1}` : '';
}

function cellHtml(v) {
    if (v.value === null) return '<span class="val uninit">неинициализирана</span>';
    const t = typeOf(v.value);
    if (t === 'function') return '<span class="val t-function">function</span>';
    return `<span class="val t-${t}">${esc(v.value)}</span><span class="type">${t}</span>`;
}

function renderTree(s, prev, anim) {
    const L = s.look;
    const hopOf = {};
    if (L) L.hops.forEach((h, i) => hopOf[h.sid] = i);

    const box = sid => {
        const sc = s.scopes[sid];
        const cls = ['scope', 'k-' + sc.kind];
        if (sid === s.cur && !sc.dying) cls.push('cur');
        if (sc.dying) cls.push('dying');
        if (prev && !prev.scopes[sid]) cls.push('appear');

        let head = `<span class="sc-label">${esc(sc.label)}</span><span class="sc-kind">${KIND_TEXT[sc.kind]}</span>`;
        if (sc.note) head += `<span class="sc-note">${esc(sc.note)}</span>`;
        if (sid === s.cur && !sc.dying) head += '<span class="here">изпълнява се тук</span>';
        if (sc.dying) head += '<span class="dtag">приключи - обхватът изчезва</span>';
        const hi = hopOf[sid];
        if (L && hi !== undefined && !L.hops[hi].hit) {
            const last = hi === L.hops.length - 1 && L.error;
            head += `<span class="miss ${last ? 'm-err' : 'm-' + L.mode}${anim ? ' await' : ''}" data-hop="${hi}">няма ${esc(L.name)}</span>`;
        }
        if (sc.kind === 'global') head += '<span class="builtins">+ вградени: <code>console</code>, <code>Math</code> и др.</span>';

        const vars = sc.vars.map(v => {
            const key = sid + '.' + v.name;
            const hl = s.hl[key];
            const isTarget = L && L.found === sid && L.name === v.name;
            const vcCls = ['vc'];
            const cellCls = ['cell'];
            let extra = '';
            if (hl === 'shadowed') { vcCls.push('shadowed'); extra = '<span class="stag">засенчена</span>'; }
            else if (hl) cellCls.push('hl-' + hl);
            if (prev && !(prev.scopes[sid] && prev.scopes[sid].vars.some(p => p.name === v.name))) vcCls.push('appear');
            let old = '';
            if (anim && isTarget) {
                cellCls.push('await-hl');
                if (L.implicit) vcCls.push('await-card');
                if (L.mode === 'write' && !L.error) {
                    cellCls.push('await');
                    old = L.implicit ? '<span class="old"></span>'
                        : L.old === null ? '<span class="old uninit">неинициализирана</span>' : `<span class="old">${esc(L.old)}</span>`;
                }
            }
            const kw = KW_TEXT[v.kind] || v.kind;
            return `<div class="${vcCls.join(' ')}" data-key="${esc(key)}">
                <div class="vc-top"><span class="name">${esc(v.name)}</span><span class="kw k-${v.kind}">${kw}</span></div>
                <div class="${cellCls.join(' ')}">${old}${cellHtml(v)}</div>${extra}
            </div>`;
        }).join('');

        const kids = s.order.filter(id => s.scopes[id].parent === sid).map(box).join('');
        return `<div class="${cls.join(' ')}" data-sid="${sid}">
            <div class="sc-head">${head}</div>
            <div class="vars">${vars}</div>
            <div class="kids">${kids}</div>
        </div>`;
    };
    const root = s.order.find(id => !s.scopes[id].parent);
    $('#tree').innerHTML = root ? box(root) : '';
}

function renderLookup(s, anim) {
    const L = s.look;
    const el = $('#lookup');
    if (!L) {
        el.innerHTML = '<span class="lk-empty">Тук ще видим как JavaScript търси всяко име: от текущия обхват навън, по веригата от обхвати (scope chain).</span>';
        return;
    }
    const aw = anim ? ' await' : '';
    const label = sid => esc(stateScopeLabel(s, sid));
    let html = `<span class="lk-q"><span class="name">${esc(L.name)}</span><span class="lk-mode m-${L.mode}">${L.mode === 'write' ? 'запис' : 'четене'}</span></span>`;
    L.hops.forEach((h, i) => {
        if (i) html += ICON_SEP.replace('lk-sep', 'lk-sep' + aw).replace('<svg', `<svg data-sep="${i}"`);
        if (!h.hit) { html += `<span class="hop miss-h${aw}" data-hop="${i}">${label(h.sid)}<small>няма</small></span>`; return; }
        let what;
        if (L.error) what = 'неинициализирана';
        else if (L.mode === 'write') what = `намерена - записва се ${L.value}`;
        else what = `намерена: ${L.value}`;
        html += `<span class="hop hit m-${L.mode}${aw}" data-hop="${i}">${label(h.sid)}<small>${esc(what)}</small></span>`;
    });
    const n = L.hops.length;
    const sep = ICON_SEP.replace('lk-sep', 'lk-sep' + aw).replace('<svg', `<svg data-sep="${n}"`);
    if (L.partial) html += sep + `<span class="hop pending${aw}" data-hop="${n}">?<small>продължаваме навън</small></span>`;
    else if (L.implicit) html += sep + `<span class="hop new${aw}" data-hop="${n}">нова глобална<small>sloppy mode, без грешка</small></span>`;
    else if (L.error && L.found === null) html += sep + `<span class="hop err${aw}" data-hop="${n}">край на веригата<small>ReferenceError</small></span>`;
    el.innerHTML = html;
}
function stateScopeLabel(s, sid) { return s.scopes[sid] ? s.scopes[sid].label : sid; }

function renderConsole(s, prev, anim) {
    const box = $('#console');
    const grew = prev && s.console.length > prev.console.length;
    box.innerHTML = s.console.map((l, i) =>
        `<div class="cline ${l.err ? 'err' : ''}${anim && grew && i === s.console.length - 1 ? ' await' : ''}"><span class="prompt">&gt;</span>${esc(l.text)}</div>`).join('');
    box.scrollTop = box.scrollHeight;
}

function renderLegend() {
    $('#legend').innerHTML = [
        '<span><i class="sw g"></i>global</span>',
        '<span><i class="sw f"></i>функция</span>',
        '<span><i class="sw b"></i>блок</span>',
        '<span><i class="sw here"></i>текущ обхват</span>',
        '<span><i class="sw link"></i>връзка навън (outer)</span>',
        '<span><i class="sw read"></i>четене</span>',
        '<span><i class="sw write"></i>запис</span>',
    ].join('');
}

// outer links: from a box's top edge up into the gap above it, left into the parent's gutter,
// up to the parent's header (so links of side-by-side boxes never cross another box)
function drawLinks(s, prev) {
    const svg = $('#links');
    const base = $('#treeWrap').getBoundingClientRect();
    const L = s.look;
    const used = {};
    // the links the search walked along are coloured
    if (L) L.hops.forEach((h, i) => {
        if (i < L.hops.length - 1 || L.partial) used[h.sid] = L.error && !L.found ? 'p-err' : 'p-' + L.mode;
    });
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    let html = `<defs>${['link', 'read', 'write', 'err'].map(c =>
        `<marker id="ah-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c === 'link' ? 'var(--link)' : `var(--${c})`}"/></marker>`).join('')}</defs>`;
    for (const sid of s.order) {
        const sc = s.scopes[sid];
        if (!sc.parent) continue;
        const el = $(`#tree .scope[data-sid="${sid}"]`);
        const pel = $(`#tree .scope[data-sid="${sc.parent}"]`);
        if (!el || !pel) continue;
        const r = el.getBoundingClientRect();
        const p = pel.getBoundingClientRect();
        const ph = $('.sc-label', pel).getBoundingClientRect();
        const x1 = r.left - base.left + .9 * rem, y1 = r.top - base.top;
        const ym = y1 - .3 * rem;
        const gx = p.left - base.left + .9 * rem;
        const y2 = ph.top + ph.height / 2 - base.top;
        const x2 = ph.left - base.left - 5;
        const cls = used[sid] || '';
        const mk = cls ? cls.slice(2) : 'link';
        const fresh = prev && !prev.scopes[sid] ? ' fresh' : '';
        const rr = Math.min(6, (ym - y2) / 2, (x1 - gx) / 2);
        html += `<path class="link ${cls}${fresh}" marker-end="url(#ah-${mk})"
            d="M${x1} ${y1} V${ym + rr} Q${x1} ${ym} ${x1 - rr} ${ym} H${gx + rr} Q${gx} ${ym} ${gx} ${ym - rr} V${y2 + rr} Q${gx} ${y2} ${gx + rr} ${y2} H${x2}"/>`;
    }
    svg.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Animation: the search chip walks the chain, then values fly
// ---------------------------------------------------------------------------
const wait = ms => new Promise(r => setTimeout(r, ms));
function bump(el) {
    el.classList.remove('land');
    void el.offsetWidth;
    el.classList.add('land');
}
function cellEl(key) { return $(`#tree .vc[data-key="${key}"] .cell`); }
function resolve(key) {
    if (key === 'con') return $('#console .cline:last-child');
    if (key === 'code') return $('#code li.active');
    if (key.startsWith('v:')) return cellEl(key.slice(2));
    return null;
}
function center(el, chip) {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2 - chip.offsetWidth / 2, r.top + r.height / 2 - chip.offsetHeight / 2];
}
function show(el) { if (el) { el.classList.remove('await', 'await-hl', 'await-card'); bump(el); } }
function unhl(el) { if (el) { el.classList.remove('await-hl'); bump(el); } }

async function playSearch(L, tk) {
    const layer = $('#flyLayer');
    const chip = document.createElement('div');
    chip.className = 'fly ' + L.mode;
    chip.innerHTML = ICON_LENS + esc(L.name);
    layer.appendChild(chip);
    const startEl = $(`#tree .scope[data-sid="${L.hops[0].sid}"] > .sc-head .sc-label`);
    let [x, y] = center(startEl, chip);
    x += startEl.getBoundingClientRect().width / 2 + chip.offsetWidth / 2 + 10;
    chip.style.transform = `translate(${x}px,${y}px)`;
    await chip.animate([{ opacity: 0, transform: `translate(${x}px,${y}px) scale(.7)` }, { opacity: 1, transform: `translate(${x}px,${y}px)` }],
        { duration: 260, fill: 'forwards' }).finished;

    const moveTo = async el => {
        const [nx, ny] = center(el, chip);
        await chip.animate([{ transform: `translate(${x}px,${y}px)` }, { transform: `translate(${nx}px,${ny}px)` }],
            { duration: HOP_MS, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' }).finished;
        x = nx; y = ny;
    };
    const reveal = i => {
        show($(`#lookup [data-hop="${i}"]`));
        const sep = $(`#lookup [data-sep="${i}"]`);
        if (sep) sep.classList.remove('await');
    };

    for (let i = 0; i < L.hops.length; i++) {
        if (tk !== token) return;
        const h = L.hops[i];
        const key = h.sid + '.' + L.name;
        const target = h.hit ? cellEl(key) : $(`#tree .miss[data-hop="${i}"]`);
        if (target) await moveTo(target);
        if (tk !== token) return;
        reveal(i);
        if (h.hit) unhl(cellEl(key));
        else show($(`#tree .miss[data-hop="${i}"]`));
        await wait(h.hit ? 200 : 380);
    }
    if (tk !== token) return;
    const n = L.hops.length;
    if (L.implicit) {
        const key = L.found + '.' + L.name;
        $(`#tree .vc[data-key="${key}"]`).classList.remove('await-card');
        reveal(n);
        await moveTo(cellEl(key));
        unhl(cellEl(key));
    } else if (L.error || L.partial) {
        reveal(n);
        if (L.error) {
            chip.classList.add('rejected');
            await chip.animate([
                { transform: `translate(${x}px,${y}px)` },
                { transform: `translate(${x + 8}px,${y}px)` },
                { transform: `translate(${x - 8}px,${y}px)` },
                { transform: `translate(${x}px,${y + 30}px)`, opacity: 0 },
            ], { duration: 650, fill: 'forwards' }).finished;
        }
    }
    chip.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }).onfinish = () => chip.remove();
}

function playFlights(flights, tk) {
    const layer = $('#flyLayer');
    return Promise.all(flights.map(([from, to, text], i) => new Promise(done => {
        const src = resolve(from), dst = resolve(to);
        if (!src || !dst || tk !== token) { done(); return; }
        const chip = document.createElement('div');
        chip.className = 'fly ' + (to.startsWith('v:') ? 'write' : 'read');
        chip.textContent = text;
        layer.appendChild(chip);
        const [x0, y0] = center(src, chip), [x1, y1] = center(dst, chip);
        const dx = x1 - x0, dy = y1 - y0;
        const lift = Math.min(90, 30 + Math.hypot(dx, dy) * .15);
        chip.animate([
            { transform: `translate(${x0}px,${y0}px) scale(.85)`, opacity: 0 },
            { transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: 1, offset: .12 },
            { transform: `translate(${x0 + dx / 2}px,${y0 + dy / 2 - lift}px) scale(1.15)`, opacity: 1, offset: .55 },
            { transform: `translate(${x1}px,${y1}px) scale(1)`, opacity: 1 },
        ], { duration: FLY_MS, delay: i * STAGGER, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' }).onfinish = () => {
            chip.remove();
            if (tk === token && dst.classList.contains('await')) show(dst);
            done();
        };
    })));
}

function autoFlights(step, s, prev) {
    const L = s.look, out = [...(step.fly || [])];
    if (!L || L.error || L.partial) return out;
    const key = 'v:' + L.found + '.' + L.name;
    if (L.mode === 'write') out.push(['code', key, plain(L.value)]);
    else if (s.console.length > prev.console.length) out.push([key, 'con', plain(L.value)]);
    return out;
}

async function playStep(step, s, prev, tk) {
    if (!prev || reduceMotion) return;
    if (s.look) await playSearch(s.look, tk);
    if (tk !== token) return;
    await playFlights(autoFlights(step, s, prev), tk);
    if (tk !== token) return;
    document.querySelectorAll('.await, .await-hl, .await-card').forEach(el => {
        const wasHidden = el.classList.contains('await');
        el.classList.remove('await', 'await-hl', 'await-card');
        if (wasHidden) bump(el);
    });
    const errLine = $('#code li.await-err');
    if (errLine) errLine.classList.remove('await-err');
}

// ---------------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------------
let scIdx = 0, stepIdx = 0, states = [], playing = false, autoTimer = null, token = 0;

function render(animate) {
    const sc = SCENARIOS[scIdx];
    const step = sc.steps[stepIdx];
    const s = states[stepIdx];
    const prev = animate && stepIdx > 0 ? states[stepIdx - 1] : null;
    const anim = !!prev && !reduceMotion;
    const tk = ++token;
    $('#flyLayer').innerHTML = '';

    renderCode(sc, s, anim);
    renderTree(s, prev, anim);
    renderLookup(s, anim);
    renderConsole(s, prev, anim);

    const N = sc.steps.length;
    $('#explainMeta').textContent = `Стъпка ${stepIdx + 1} от ${N}`;
    const ex = $('#explain');
    ex.innerHTML = step.text;
    ex.classList.remove('fresh'); void ex.offsetWidth; ex.classList.add('fresh');

    $('#progress').innerHTML = sc.steps.map((_, i) =>
        `<button class="${i < stepIdx ? 'done' : i === stepIdx ? 'cur' : ''}" data-i="${i}" title="Стъпка ${i + 1}" aria-label="Стъпка ${i + 1}"></button>`).join('');
    $('#firstBtn').disabled = $('#prevBtn').disabled = stepIdx === 0;
    $('#nextBtn').disabled = stepIdx === N - 1;
    $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    try { history.replaceState(null, '', location.pathname + location.search + `#${scIdx + 1}.${stepIdx + 1}`); } catch (e) { /* file:// in some browsers */ }

    drawLinks(s, prev);
    requestAnimationFrame(() => {
        if (tk !== token) return;
        drawLinks(s, prev);
        playStep(step, s, prev, tk);
    });
    scheduleAuto();
}

function goto(i, animate = false) {
    const N = SCENARIOS[scIdx].steps.length;
    stepIdx = Math.max(0, Math.min(N - 1, i));
    render(animate);
}
function next() {
    if (stepIdx < SCENARIOS[scIdx].steps.length - 1) goto(stepIdx + 1, true);
    else setPlaying(false);
}
function prev() { goto(stepIdx - 1); }

function setPlaying(on) {
    playing = on;
    $('#playBtn').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    if (playing && stepIdx === SCENARIOS[scIdx].steps.length - 1) goto(0);
    else if (playing) next();
    else clearTimeout(autoTimer);
}
function scheduleAuto() {
    clearTimeout(autoTimer);
    if (!playing) return;
    const sc = SCENARIOS[scIdx];
    if (stepIdx >= sc.steps.length - 1) { playing = false; $('#playBtn').innerHTML = ICON_PLAY; return; }
    const len = sc.steps[stepIdx].text.replace(/<[^>]+>/g, '').length;
    const L = states[stepIdx].look;
    const anim = L ? 600 + L.hops.length * (HOP_MS + 380) + FLY_MS : 0;
    autoTimer = setTimeout(next, Math.min(12000, Math.max(2800, 1200 + len * 40) + anim));
}

function selectScenario(i, step = 0) {
    scIdx = Math.max(0, Math.min(SCENARIOS.length - 1, i));
    states = computeStates(SCENARIOS[scIdx]);
    document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', j === scIdx));
    playing = false;
    goto(step);
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
$('#tabs').innerHTML = SCENARIOS.map((sc, i) =>
    `<button class="tab" role="tab" data-i="${i}">${i + 1}. ${esc(sc.tab)}${sc.advanced ? '<span class="adv">advanced</span>' : ''}</button>`).join('');
$('#tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) selectScenario(+t.dataset.i);
});
$('#progress').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { setPlaying(false); goto(+b.dataset.i); }
});
$('#nextBtn').addEventListener('click', next);
$('#prevBtn').addEventListener('click', () => { setPlaying(false); prev(); });
$('#firstBtn').addEventListener('click', () => { setPlaying(false); goto(0); });
$('#playBtn').addEventListener('click', () => setPlaying(!playing));
// keep focus off the buttons, so Space always means "next step"
document.querySelectorAll('.btn, .tab').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));

document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (onButton && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); setPlaying(false); prev(); }
    else if (e.key === 'Home') { e.preventDefault(); setPlaying(false); goto(0); }
    else if (e.key === 'p' || e.key === 'P') setPlaying(!playing);
    else if (/^[1-9]$/.test(e.key) && +e.key <= SCENARIOS.length) selectScenario(+e.key - 1);
});

$('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.dataset.theme
        ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = isDark ? 'light' : 'dark';
    try { localStorage.setItem('scopeChainTheme', root.dataset.theme); } catch (e) { /* storage blocked */ }
});
try {
    const t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('scopeChainTheme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) { /* storage blocked */ }

renderLegend();
// links are positioned in pixels, so redraw them when the layout changes
new ResizeObserver(() => { if (states[stepIdx]) drawLinks(states[stepIdx], null); }).observe($('#treeWrap'));

// #selftest: walk every step of every scenario and report errors and overflow
function selfTest() {
    const problems = [];
    let steps = 0;
    const over = (el, what, sc, i) => {
        if (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) problems.push(`${sc + 1}.${i + 1} ${what} overflow`);
    };
    SCENARIOS.forEach((sc, k) => {
        try { selectScenario(k); } catch (e) { problems.push(`${k + 1} ${e.message}`); return; }
        sc.steps.forEach((_, i) => {
            steps++;
            try { goto(i); } catch (e) { problems.push(`${k + 1}.${i + 1} ${e.message}`); return; }
            const step = sc.steps[i], s = states[i];
            if (step.line >= (s.code || sc.code).length) problems.push(`${k + 1}.${i + 1} line out of range`);
            for (const [from, to] of step.fly || []) {
                if (!resolve(from)) problems.push(`${k + 1}.${i + 1} no element for ${from}`);
                if (!resolve(to)) problems.push(`${k + 1}.${i + 1} no element for ${to}`);
            }
            over($('#treeWrap'), 'tree', k, i);
            over($('.code-panel'), 'code', k, i);
            over(document.documentElement, 'page', k, i);
            if ($('.bottom').getBoundingClientRect().bottom > innerHeight + 1) problems.push(`${k + 1}.${i + 1} footer below the fold`);
        });
    });
    document.title = problems.length ? 'SELFTEST FAIL' : 'SELFTEST OK';
    const out = document.createElement('pre');
    out.id = 'selftest';
    out.textContent = document.title + `\n${SCENARIOS.length} scenarios, ${steps} steps` + (problems.length ? '\n' + problems.join('\n') : '');
    document.body.appendChild(out);
}

function fromHash() {
    const h = location.hash.slice(1);
    if (h === 'selftest') { selfTest(); return; }
    const [a, b] = h.split('.');
    selectScenario((parseInt(a, 10) || 1) - 1, (parseInt(b, 10) || 1) - 1);
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
<script>
// language switch: keep the current scenario / step (#N.M) and theme
(function () {
    var a = document.getElementById('langBtn');
    if (!a) return;
    var base = a.getAttribute('href');
    a.addEventListener('click', function () {
        var t = document.documentElement.dataset.theme;
        a.href = base + (t === 'light' || t === 'dark' ? '?theme=' + t : '') + location.hash;
    });
})();
</script>
</body>
